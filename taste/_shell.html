<!doctype html>
<html lang="en">
<head>
  <!-- 1. Charset + viewport -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 2. Title (headline + " | tasu.ai", 60 characters or less) + description (70 to 160 characters, the answer first) -->
  <title>Page headline | tasu.ai</title>
  <meta name="description" content="Template for every tasu.ai page. Copy this head, header and footer, then fill the main element with one job and one lime button.">
  <!-- 3. Canonical goes here on a real page:
       link rel=canonical href=https://www.jeremylasne.com/taste/PAGE/ (home: /taste/).
       This template has none and stays noindex, so the sitemap skips it. -->
  <meta name="robots" content="noindex">
  <!-- 4. Open Graph + Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="tasu.ai">
  <meta property="og:url" content="https://www.jeremylasne.com/taste/">
  <meta property="og:title" content="Page headline | tasu.ai">
  <meta property="og:description" content="Template for every tasu.ai page. Copy this head, header and footer, then fill the main element with one job and one lime button.">
  <meta property="og:image" content="https://www.jeremylasne.com/og-image.png?v=8">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@jeremylasne">
  <meta name="twitter:title" content="Page headline | tasu.ai">
  <meta name="twitter:description" content="Template for every tasu.ai page. Copy this head, header and footer, then fill the main element with one job and one lime button.">
  <meta name="twitter:image" content="https://www.jeremylasne.com/og-image.png?v=8">
  <!-- 5. Theme color + icons -->
  <meta name="theme-color" content="#FAF8F3">
  <link rel="icon" href="/taste/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- 6. Fonts: Fraunces (display), Inter (UI + body), Geist Mono (values only) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
  <!-- 7. Design system, then page CSS (tokens only) -->
  <link rel="stylesheet" href="/taste/tasu.css">
  <style>
    /* Page CSS goes here. Use the tokens from tasu.css: --bg --ink --accent --n1..--n4, --t1..--t7, --s1..--s8, --r-sm --r-in --r-card. */
  </style>
  <!-- 8. JS flag before paint (reveal-on-scroll hides only when JS runs), then shared JS, deferred -->
  <script>document.documentElement.classList.add("js");setTimeout(function(){if(!window.tasu)document.documentElement.classList.remove("js")},3000)</script>
  <script src="/taste/tasu.js" defer></script>
  <!-- 9. JSON-LD (real pages): WebPage or WebSite + BreadcrumbList (tasu.ai /taste/ > this page) -->
</head>
