  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d082b0a9-9647-43d4-ba68-c992bacdb5df\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\/style>\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  :root {\n    --pixel: 'Press Start 2P', monospace;\n    --mono: 'JetBrains Mono', ui-monospace, monospace;\n  }\n  html, body { overflow-x: hidden; }\n  body {\n    font-family: var(--mono);\n    background: #ece8d0;\n    -webkit-font-smoothing: antialiased;\n    image-rendering: pixelated;\n  }\n  .page { width: 100%; }\n  a { color: inherit; }\n\n  /* ── Eyebrow ─────────────────────────────────────────────── */\n  .eyebrow {\n    display: flex; align-items: center; gap: 10px;\n    font-family: var(--mono);\n    font-size: 12px; font-weight: 700;\n    letter-spacing: 0.32em; text-transform: uppercase;\n  }\n  .eyebrow .tick { width: 9px; height: 9px; display: inline-block; }\n\n  /* ── Hero ────────────────────────────────────────────────── */\n  .hero {\n    position: relative;\n    min-height: 100vh;\n    display: flex; flex-direction: column;\n    align-items: center; justify-content: center;\n    overflow: hidden;\n    padding: 4vh 24px 0;\n  }\n  .hero-content {\n    position: relative; z-index: 5;\n    text-align: center;\n    max-width: 720px;\n    display: flex; flex-direction: column; align-items: center;\n    gap: 22px;\n  }\n  .eyebrow { justify-content: center; }\n  .hero-name {\n    font-family: var(--pixel);\n    font-size: clamp(38px, 8.5vw, 92px);\n    line-height: 1.15;\n    letter-spacing: 0.02em;\n    text-shadow: 5px 5px 0 rgba(43,42,34,0.10);\n  }\n  .hero-name span { display: block; }\n  .hero-sub {\n    font-family: var(--mono);\n    font-size: clamp(13px, 1.4vw, 16px);\n    line-height: 1.75;\n    max-width: 46ch;\n    text-wrap: pretty;\n  }\n  .hero-links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }\n\n  /* Pixel-style button links */\n  .hero-link {\n    font-family: var(--mono);\n    font-size: 13px; font-weight: 700;\n    text-decoration: none;\n    padding: 11px 18px;\n    border: 3px solid currentColor;\n    background: transparent;\n    box-shadow: 5px 5px 0 var(--ac, #b5482f);\n    transition: transform .12s steps(2), box-shadow .12s steps(2);\n    white-space: nowrap;\n  }\n  .hero-link:hover {\n    transform: translate(3px, 3px);\n    box-shadow: 2px 2px 0 var(--ac, #b5482f);\n    color: var(--ac, #b5482f);\n  }\n\n  .scroll-cue {\n    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);\n    z-index: 6;\n    font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em;\n  }\n  .scroll-cue.bob { animation: bob 1.8s steps(3) infinite; }\n\n  /* ── Scene backdrop ──────────────────────────────────────── */\n  .scene { position: absolute; inset: 0; z-index: 1; pointer-events: none; }\n\n  /* Painted backdrop (media/hero-bg.png). Anchored bottom-center so the\n     foreground grass stays pinned to the floor of the hero at every aspect\n     ratio — that strip is where the deer walks. Only mounts once the file\n     actually loads; see Scene() in the app script. */\n  .hero-photo {\n    position: absolute; inset: 0; z-index: 0;\n    background: url(\"media/hero-bg.png\") center bottom / cover no-repeat;\n    image-rendering: pixelated;\n    pointer-events: none;\n  }\n  /* The art is painted at midday; warm it toward evening for the dusk palette. */\n  .sky--dusk .hero-photo { filter: sepia(0.32) saturate(1.12) hue-rotate(-10deg) brightness(0.95); }\n\n  /* Backdrop supplies the ground, so the band is just an anchor for the deer. */\n  .ground-band--bare { background: none; border-top: 0; }\n  .clouds { position: absolute; inset: 0; z-index: 2; pointer-events: none; }\n  .cloud { position: absolute; left: 0; }\n  .cloud--drift { animation: drift linear infinite; }\n\n  .sun-wrap {\n    position: absolute; top: 13vh; left: 50%; transform: translateX(-50%);\n    width: 64px; height: 64px;\n  }\n  .sun-glow {\n    position: absolute; left: 50%; top: 50%;\n    width: 260px; height: 260px; transform: translate(-50%, -50%);\n    border-radius: 50%;\n  }\n  .sun-glow--pulse { animation: sunpulse 5s ease-in-out infinite; }\n  .sun { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }\n\n  .ground-band { position: absolute; bottom: 0; left: 0; right: 0; height: 48px; z-index: 1; }\n  .ground-band .pine { position: absolute; bottom: 40px; }\n  .ground-band .bush { position: absolute; bottom: 38px; }\n  .ground-band .rock { position: absolute; bottom: 38px; }\n\n  /* Walking deer — exact gif as a transparent 48-frame sprite sheet, driven\n     by JS (background-position + translateX) so it can pause when lying. */\n  .bear { position: absolute; bottom: 34px; left: 0; z-index: 4; }\n  .deer {\n    width: 163px; height: 131px;\n    background: url(\"9e837ec2-9a5b-4a8a-a4b4-57e5f1b55918\") 0 0 / 7824px 131px no-repeat;\n    image-rendering: pixelated;\n  }\n\n  /* Birds */\n  .birds { position: absolute; inset: 0; z-index: 3; pointer-events: none; }\n  .bird { position: absolute; left: 0; }\n  .bird--fly { animation: drift-rev linear infinite; }\n  .bird-bob { animation: birdwave ease-in-out infinite; }\n  .bird-flap { animation: flap 0.5s steps(2) infinite; }\n\n  /* Floating newspapers — the way through to /wealth and /mobileapp */\n  .paper {\n    position: absolute; z-index: 6;\n    top: 23vh; right: 7vw;\n    display: flex; flex-direction: column; align-items: center; gap: 12px;\n  }\n  .paper-main {\n    display: flex; flex-direction: column; align-items: center; gap: 12px;\n    color: inherit; text-decoration: none;\n  }\n  .paper-sheet {\n    display: block;\n    transform: rotate(-7deg);\n    filter: drop-shadow(0 7px 0 rgba(43,42,34,0.10));\n    transition: filter .2s steps(2);\n  }\n  .paper-sheet--float { animation: paperfloat 7s ease-in-out infinite; }\n  .paper-main:hover .paper-sheet { filter: drop-shadow(0 11px 0 rgba(43,42,34,0.16)); }\n  .paper-label {\n    font-family: var(--mono);\n    font-size: 11px; font-weight: 700;\n    letter-spacing: 0.22em; text-transform: uppercase;\n    padding: 8px 12px;\n    border: 3px solid currentColor;\n    box-shadow: 4px 4px 0 var(--ac, #b5482f);\n    white-space: nowrap;\n    transition: transform .12s steps(2), box-shadow .12s steps(2);\n  }\n  .paper-main:hover .paper-label {\n    transform: translate(2px, 2px);\n    box-shadow: 2px 2px 0 var(--ac, #b5482f);\n    color: var(--ac, #b5482f);\n  }\n  .paper--left { right: auto; left: 7vw; top: 31vh; }\n  .paper--left .paper-sheet { transform: rotate(7deg); }\n  .paper--left .paper-sheet--float { animation-name: paperfloat-rev; animation-duration: 8s; }\n\n  /* The wealth paper stands for a whole section rather than one page, so it is\n     sized up and carries deep links to the three pieces underneath. */\n  /* wider than the other paper, so it sits closer to the edge to stay clear of\n     the wordmark on mid-size desktops */\n  .paper--major { top: 15vh; right: 3vw; gap: 16px; }\n  .paper--major .paper-main { gap: 16px; }\n  .paper--major .paper-label {\n    font-size: 14px; letter-spacing: 0.24em;\n    padding: 11px 18px; border-width: 4px;\n    box-shadow: 6px 6px 0 var(--ac, #b5482f);\n  }\n  .paper--major .paper-main:hover .paper-label { box-shadow: 3px 3px 0 var(--ac, #b5482f); }\n  .paper--major .paper-note { padding: 13px 16px; max-width: 340px; opacity: 0.9; }\n  .paper--major .paper-note-title { font-size: 9.5px; margin-bottom: 9px; }\n  .paper--major .paper-note-rows { gap: 6px; }\n  .paper--major .paper-note-rows li { font-size: 12.5px; gap: 18px; }\n\n  .paper-links {\n    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;\n    max-width: 340px;\n  }\n  .paper-links a {\n    font-family: var(--mono);\n    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;\n    color: inherit; text-decoration: none; opacity: 0.7;\n    padding: 5px 9px; border: 2px solid currentColor;\n    transition: opacity .12s steps(2), color .12s steps(2), transform .12s steps(2);\n  }\n  .paper-links a:hover { opacity: 1; color: var(--ac, #b5482f); transform: translate(1px, 1px); }\n\n  /* Between the tuned mobile hero and a full desktop the name is still near\n     full size while the sky has lost its shoulders, so the papers ran into\n     the wordmark. Pull them to the edges and shrink from the outside in. */\n  @media (min-width: 721px) and (max-width: 1300px) {\n    .paper { right: 2vw; transform: scale(0.74); transform-origin: top right; }\n    .paper--left { right: auto; left: 2vw; transform: scale(0.74); transform-origin: top left; }\n    .paper--major { top: 12vh; }\n  }\n  @media (min-width: 721px) and (max-width: 1080px) {\n    .paper, .paper--left { transform: scale(0.62); }\n    /* the ledger + links make the wealth paper tall; lift it clear of the\n       wordmark rather than letting the two fight for the same corner */\n    .paper--major { top: 5vh; }\n  }\n  @media (min-width: 721px) and (max-width: 810px) {\n    .paper, .paper--left { transform: scale(0.55); }\n  }\n\n  /* Small ledger pinned under a paper — quick stats, not a separate link */\n  .paper-note {\n    margin: 2px 0 0;\n    padding: 9px 12px;\n    border: 2px dashed currentColor;\n    opacity: 0.82;\n    font-family: var(--mono);\n    width: max-content;\n    max-width: 280px;\n    box-sizing: border-box;\n  }\n  .paper-note-title {\n    font-size: 8px; font-weight: 700;\n    letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--ac, #b5482f);\n    margin-bottom: 6px;\n  }\n  .paper-note-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }\n  .paper-note-rows li { display: flex; gap: 14px; font-size: 10.5px; line-height: 1.4; white-space: nowrap; }\n  .pn-name { flex: 1 1 auto; opacity: 0.75; }\n  .pn-val { flex: none; font-weight: 700; }\n\n  /* Layout: SPOTLIGHT — giant sun behind the name */\n  .hero--spotlight .sun-wrap { top: 46%; }\n  .hero--spotlight .sun { transform: translate(-50%, -50%) scale(3.4); }\n  .hero--spotlight .sun-glow { width: 520px; height: 520px; }\n  .hero--spotlight .cloud:nth-child(2),\n  .hero--spotlight .cloud:nth-child(3) { display: none; }\n\n  /* Layout: MINIMAL — content lower-left, lots of empty sky */\n  .hero--minimal { align-items: flex-start; justify-content: flex-end; padding-bottom: 16vh; }\n  .hero--minimal .hero-content { text-align: left; align-items: flex-start; padding-left: 4vw; }\n  .hero--minimal .eyebrow { justify-content: flex-start; }\n  .hero--minimal .sun-wrap { top: 10vh; left: auto; right: 9vw; transform: none; }\n  .hero--minimal .cloud:nth-child(1),\n  .hero--minimal .cloud:nth-child(4) { display: none; }\n\n  /* ── Projects ────────────────────────────────────────────── */\n  .projects { position: relative; padding: 92px 24px 56px; }\n  .projects-head { text-align: center; }\n  .projects-title {\n    font-family: var(--pixel);\n    font-size: clamp(18px, 2.8vw, 30px);\n    margin-top: 20px;\n    letter-spacing: 0.01em;\n  }\n  /* One project per row: live-site frame on one side, hook + subtitle on the\n     other — sides alternate per row (.proj-row--flip). */\n  .proj-list {\n    position: relative; z-index: 3;\n    display: flex; flex-direction: column;\n    gap: clamp(56px, 8vw, 88px);\n    max-width: 1060px; margin: 72px auto 0;\n  }\n  .proj-row {\n    display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);\n    gap: clamp(28px, 4.5vw, 60px);\n    align-items: center;\n  }\n  .proj-row--flip { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }\n  .proj-row--flip .proj-embed { order: 2; }\n  .proj-row--flip .proj-copy { order: 1; }\n\n  /* Pixel browser frame around the live embed */\n  .proj-frame {\n    border: 3px solid #2b2a22;\n    background: #0d1226;\n    box-shadow: 8px 8px 0 var(--ac);\n    transition: transform .14s steps(2), box-shadow .14s steps(2);\n  }\n  .proj-frame:hover { transform: translate(-2px, -2px); box-shadow: 10px 10px 0 var(--ac); }\n  .proj-chrome {\n    display: flex; align-items: center; gap: 7px;\n    padding: 9px 11px;\n    background: rgba(245,242,226,0.96);\n    border-bottom: 3px solid #2b2a22;\n  }\n  .pc-dot { width: 8px; height: 8px; }\n  .pc-url {\n    margin-left: 7px; min-width: 0;\n    font-family: var(--mono); font-size: 10.5px; font-weight: 700;\n    letter-spacing: 0.06em; color: #2b2a22;\n    padding: 3px 8px;\n    background: #e7e2cb; border: 2px solid #2b2a22;\n    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n  }\n  .proj-screen { position: relative; overflow: hidden; aspect-ratio: 16 / 10; }\n  .proj-iframe {\n    position: absolute; top: 0; left: 0;\n    width: 1280px; height: 800px; border: 0;\n    transform-origin: 0 0;\n    pointer-events: none; /* preview only — the overlay link opens the site */\n    background: #fff;\n    transition: opacity .35s;\n  }\n  .proj-screen-link {\n    position: absolute; inset: 0; z-index: 2;\n    display: flex; align-items: flex-end; justify-content: flex-end;\n    padding: 12px; text-decoration: none;\n  }\n  .proj-visit {\n    font-family: var(--mono); font-size: 10.5px; font-weight: 700;\n    letter-spacing: 0.1em; color: #2b2a22;\n    padding: 6px 10px;\n    background: rgba(245,242,226,0.96); border: 2px solid #2b2a22;\n    box-shadow: 3px 3px 0 var(--ac);\n    opacity: 0; transform: translateY(4px);\n    transition: opacity .14s steps(2), transform .14s steps(2);\n  }\n  .proj-screen-link:hover .proj-visit,\n  .proj-screen-link:focus-visible .proj-visit { opacity: 1; transform: none; }\n  .proj-ph {\n    position: absolute; inset: 0;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    gap: 14px; text-align: center; padding: 18px;\n  }\n  .proj-ph-cap {\n    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em;\n    text-transform: uppercase; color: #aab2cb;\n  }\n\n  /* Copy side: status pill, name, hook, subtitle, CTA */\n  .proj-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 13px; }\n  .proj-name-row { display: flex; align-items: center; gap: 13px; }\n  .proj-name {\n    font-family: var(--pixel); font-size: clamp(17px, 2.1vw, 23px);\n    color: #f2eedd; letter-spacing: 0.01em;\n    text-shadow: 3px 3px 0 rgba(9,12,26,0.55);\n  }\n  .proj-hook {\n    font-family: var(--mono); font-size: clamp(14.5px, 1.5vw, 16.5px); font-weight: 700;\n    line-height: 1.55; color: #dfe4f2; text-wrap: balance; max-width: 34ch;\n  }\n  .proj-sub {\n    font-family: var(--mono); font-size: 13px; line-height: 1.75;\n    color: #aab2cb; text-wrap: pretty; max-width: 44ch;\n  }\n  .proj-cta { margin-top: 5px; font-size: 12px; padding: 9px 14px; }\n  .bldg-status {\n    display: inline-flex; align-items: center; gap: 6px;\n    font-family: var(--mono); font-size: 9.5px; font-weight: 700;\n    letter-spacing: 0.16em; text-transform: uppercase;\n  }\n  .status-dot { width: 7px; height: 7px; display: inline-block; }\n\n  /* Night zone wrapping Open Doors + Workshop */\n  .night-zone {\n    position: relative;\n    background: linear-gradient(180deg, #ece8d0 0%, #1c2238 5%, #232b48 50%, #1b2138 100%);\n  }\n  .night-zone > section { position: relative; z-index: 1; }\n  .night-sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }\n  .nstar { position: absolute; background: #f4efdd; image-rendering: pixelated; opacity: 0.8; }\n  .nstar.tw { animation: twinkle 3.2s ease-in-out infinite; }\n  .night-moon { position: absolute; top: 4%; right: 9%; opacity: 0.92; filter: drop-shadow(0 0 14px rgba(240,236,210,0.45)); }\n  .ncloud { position: absolute; left: 0; }\n\n  /* ── What I'm looking for ────────────────────────────────── */\n  .looking { position: relative; padding: 96px 24px 40px; }\n  .look-grid {\n    display: grid; grid-template-columns: repeat(2, 1fr);\n    gap: 26px;\n    max-width: 880px; margin: 56px auto 0;\n  }\n  .look-card {\n    display: flex; flex-direction: column; align-items: flex-start; gap: 14px;\n    padding: 28px 26px;\n    color: #2b2a22;\n    background: rgba(245,242,226,0.96);\n    border: 3px solid #2b2a22;\n    box-shadow: 7px 7px 0 var(--ac);\n    transition: transform .14s steps(2), box-shadow .14s steps(2);\n  }\n  .look-card:hover { transform: translate(-2px,-2px); box-shadow: 9px 9px 0 var(--ac); }\n  .look-icon { margin-bottom: 2px; }\n  .look-title { font-family: var(--pixel); font-size: 13px; line-height: 1.5; }\n  .look-body { font-family: var(--mono); font-size: 13px; line-height: 1.7; text-wrap: pretty; }\n  .look-ctas { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 4px; }\n  .look-cta { align-self: flex-start; }\n\n  .footer {\n    display: flex; align-items: center; justify-content: center; gap: 12px;\n    flex-wrap: wrap;\n    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;\n    padding: 34px 24px 40px;\n  }\n  .footer .hero-link { padding: 6px 12px; box-shadow: 3px 3px 0 var(--ac); font-size: 11px; }\n  .footer .dot { opacity: 0.5; }\n\n  /* ── Animations ──────────────────────────────────────────── */\n  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }\n  @keyframes drift-rev { from { transform: translateX(130vw); } to { transform: translateX(-30vw); } }\n  @keyframes birdwave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }\n  @keyframes walk { from { transform: translateX(-14vw); } to { transform: translateX(112vw); } }\n  @keyframes deerplay { from { background-position-x: 0; } to { background-position-x: -7824px; } }\n  @keyframes flap { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.6); } }\n  @keyframes sunpulse { 0%,100% { opacity: .5; transform: translate(-50%,-50%) scale(1); } 50% { opacity: .85; transform: translate(-50%,-50%) scale(1.07); } }\n  @keyframes bob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(4px); } }\n  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }\n  @keyframes paperfloat {\n    0%   { transform: translateY(0)     rotate(-7deg); }\n    25%  { transform: translateY(-11px) rotate(-3deg); }\n    50%  { transform: translateY(-5px)  rotate(-10deg); }\n    75%  { transform: translateY(-14px) rotate(-5deg); }\n    100% { transform: translateY(0)     rotate(-7deg); }\n  }\n  @keyframes paperfloat-rev {\n    0%   { transform: translateY(0)     rotate(7deg); }\n    25%  { transform: translateY(-13px) rotate(4deg); }\n    50%  { transform: translateY(-6px)  rotate(11deg); }\n    75%  { transform: translateY(-10px) rotate(5deg); }\n    100% { transform: translateY(0)     rotate(7deg); }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    .cloud--drift, .sun-glow--pulse, .scroll-cue.bob, .bird--fly, .bird-bob, .bird-flap, .bear--walk, .deer, .paper-sheet--float { animation: none !important; }\n  }\n\n  /* ── Mobile ──────────────────────────────────────────────── */\n  @media (max-width: 720px) {\n    .hero { padding: 4vh 20px 0; }\n    .hero-name { text-shadow: 3px 3px 0 rgba(43,42,34,0.10); }\n    .hero-content { gap: 18px; }\n    .projects { padding: 64px 18px 40px; }\n    .projects-title { margin-top: 16px; }\n    .proj-list { margin-top: 44px; gap: 52px; }\n    .proj-row, .proj-row--flip { grid-template-columns: 1fr; gap: 20px; }\n    .proj-row--flip .proj-embed { order: 0; }\n    .proj-row--flip .proj-copy { order: 0; }\n    .proj-hook, .proj-sub { max-width: none; }\n    .p
