<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #050b16;
    --blue: #5fa8d3;
    --ice: #eaf4fb;
    --ice-70: rgba(234, 244, 251, .72);
    --ice-45: rgba(234, 244, 251, .46);
    --line: rgba(95, 168, 211, .18);
  }

  html { background: var(--ink); color-scheme: dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ice);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: var(--blue); color: var(--ink); }

  /* ---- the ridge from /bio, blurred, and the snow over it ---- */
  .bg {
    position: fixed; top: -6%; left: -6%; width: 112%; height: 112%; z-index: 0; pointer-events: none;
    object-fit: cover; object-position: 50% 42%;
    filter: blur(9.5px) brightness(.5) saturate(.9);
  }
  #snow { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

  main {
    position: relative; z-index: 2;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 24px 48px;
  }

  .col { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .reveal { animation: riseIn .7s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--d, 0) * 1ms); }

  .avatar-wrap { position: relative; margin-bottom: 26px; }
  .avatar-wrap::before {
    content: ""; position: absolute; inset: -14px; border-radius: 50%; z-index: -1;
    background: rgba(95,168,211,.35); filter: blur(30px);
  }
  .avatar {
    display: block; width: 104px; height: 104px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 1px rgba(234,244,251,.12), 0 12px 40px -8px rgba(95,168,211,.45);
  }

  h1 { font-size: 30px; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }

  /* ---- the socials, just under the name ---- */
  .socials { display: flex; gap: 10px; margin-top: 18px; }
  .socials a {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
    color: var(--ice-70); border: 1px solid var(--line); background: rgba(5,11,22,.35);
    transition: color .2s, border-color .2s, background .2s, transform .25s cubic-bezier(.22,1,.36,1);
  }
  .socials svg { width: 20px; height: 20px; fill: currentColor; }
  .socials svg.line { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  @media (hover: hover) {
    .socials a:hover { color: var(--blue); border-color: rgba(95,168,211,.5); background: rgba(234,244,251,.06); transform: translateY(-2px); }
  }
  .socials a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  section { width: 100%; margin-top: 10px; text-align: left; }
  .socials + section { margin-top: 36px; }
  .arrow { width: 16px; height: 16px; flex: none; fill: var(--ice-45); transition: transform .25s cubic-bezier(.22,1,.36,1), fill .2s; }

  /* ---- the shape both blocks share: a rounded card on the ridge ---- */
  .card, .tile {
    border-radius: 18px; border: 1px solid var(--line); background: rgba(5,11,22,.55);
    text-decoration: none; color: inherit; transition: border-color .25s;
  }
  @media (hover: hover) {
    .card:hover, .tile:hover { border-color: rgba(95,168,211,.5); }
    .card:hover .name, .tile:hover .t-name { color: var(--blue); }
    .card:hover .arrow, .tile:hover .arrow { fill: var(--blue); transform: translate(2px,-2px); }
  }
  .card:focus-visible, .tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---- CreatorMatch: one card, its content centred ---- */
  .card { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 18px 48px; text-align: center; }
  .card .head { display: flex; align-items: center; gap: 12px; }
  .card .logo { width: 28px; height: 28px; flex: none; }
  .card .name { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .card .desc { font-size: 15px; line-height: 24px; color: var(--ice-70); }
  .card .arrow { position: absolute; top: 50%; right: 18px; margin-top: -8px; }

  /* ---- the mobile app bento: each tile shows its page, the caption sits under it ---- */
  .bento { display: grid; grid-template-columns: 1fr 1.12fr; gap: 10px; }
  .tile { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .tile.tall { grid-row: span 2; }
  .tile.wide { grid-column: 1 / -1; }
  .tile .shot { position: relative; overflow: hidden; aspect-ratio: 1200 / 630; background: rgba(234,244,251,.04); }
  .tile.tall .shot { aspect-ratio: auto; flex: 1 1 0; min-height: 0; }
  .tile .shot img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transition: transform .6s cubic-bezier(.22,1,.36,1);
  }
  .tile.tall .shot img { object-position: 50% 40%; }
  @media (hover: hover) { .tile:hover .shot img { transform: scale(1.04); } }
  .tile .cap { display: flex; align-items: center; gap: 10px; padding: 11px 14px 12px; border-top: 1px solid var(--line); }
  .tile .txt { flex: 1 1 auto; min-width: 0; }
  .tile .t-name { display: block; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -.01em; }
  .tile .t-desc { display: block; font-size: 13px; line-height: 18px; color: var(--ice-70); }
  .tile .tag {
    margin-left: 6px; vertical-align: 1px; font-size: 10px; font-weight: 600; letter-spacing: .06em;
    color: var(--ice-45); border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px;
  }
  /* the full-length tile closing the bento: no picture, the address is the point */
  .tile.wide .cap { border-top: 0; padding: 18px 20px 18px 22px; }
  .tile.wide .t-name { font-size: 17px; line-height: 24px; overflow-wrap: anywhere; }
  .tile.wide .t-desc { font-size: 14px; line-height: 20px; }

  @media (min-width: 640px) { h1 { font-size: 34px; } }
  @media (max-width: 520px) {
    .card { flex-direction: column; gap: 4px; padding: 18px 40px; }
    .bento { grid-template-columns: 1fr; }
    .tile.tall { grid-row: auto; }
    .tile.tall .shot { flex: none; aspect-ratio: 5 / 7; }
    .tile.wide .cap { padding: 16px 16px 16px 18px; }
    .tile.wide .t-name { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

  /* ---- the wind, and the one control for it, top right ---- */
  .mute {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 3;
    width: 40px; height: 40px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%; cursor: pointer; color: var(--ice-45);
  }
  .mute svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .mute .body { fill: currentColor; stroke: none; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: block; }
  @media (hover: hover) { .mute:hover { color: var(--blue); } }
  .mute:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---- the toast, bottom centre, after the address is copied ---- */
  .toast {
    position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 4;
    width: max-content; max-width: calc(100vw - 32px); margin: 0 auto; padding: 12px 18px; border-radius: 999px;
    background: rgba(234,244,251,.96); color: var(--ink);
    font-size: 14px; line-height: 1.4; letter-spacing: -.01em; text-align: center;
    box-shadow: 0 12px 40px -8px rgba(5,11,22,.6);
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .25s cubic-bezier(.22,1,.36,1), transform .25s cubic-bezier(.22,1,.36,1);
  }
  .toast[data-open] { opacity: 1; transform: none; }
  .toast b { font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<script src="snow.js" defer></script>
<script>
  /* The wind plays on arrival and loops, wrapping just before the recording's
     silent tail. Browsers that refuse sound before a gesture get it on the
     first click or key instead. Mute once and it stays muted on the next visit. */
  (function () {
    var a = document.getElementById("wind"), b = document.getElementById("mute");
    var off = localStorage.getItem("wind") === "off";
    a.ontimeupdate = function () { if (a.currentTime > 57) a.currentTime = 0; };
    function paint() { b.setAttribute("aria-pressed", off); b.setAttribute("aria-label", off ? "Unmute the wind" : "Mute the wind"); }
    function blow() { if (!off) a.play().catch(function () {}); }
    b.onclick = function () { off = !off; localStorage.setItem("wind", off ? "off" : "on"); off ? a.pause() : blow(); paint(); };
    addEventListener("click", blow, { once: true });
    addEventListener("keydown", blow, { once: true });
    a.onerror = function () { b.hidden = true; };
    paint(); b.hidden = false; blow();
  })();

  /* The email links copy the address too: on a machine with no mail app,
     mailto: alone does nothing visible. The mail app still opens where one exists. */
  (function () {
    var t = document.getElementById("toast"), timer;
    function show() {
      t.innerHTML = "<b>Address copied.</b> Do send me an email.";
      t.setAttribute("data-open", "");
      clearTimeout(timer);
      timer = setTimeout(function () { t.removeAttribute("data-open"); }, 2600);
    }
    Array.prototype.forEach.call(document.querySelectorAll("[data-mail]"), function (a) {
      var email = a.getAttribute("href").slice("mailto:".length);
      function ask() { window.prompt("Copy the address:", email); }
      a.addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(email).then(show, ask);
        else ask();
      });
    });
  })();
</script>
