document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d082b0a9-9647-43d4-ba68-c992bacdb5df\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  :root {\n    --pixel: 'Press Start 2P', monospace;\n    --mono: 'JetBrains Mono', ui-monospace, monospace;\n  }\n  html, body { overflow-x: hidden; }\n  body {\n    font-family: var(--mono);\n    background: #ece8d0;\n    -webkit-font-smoothing: antialiased;\n    image-rendering: pixelated;\n  }\n  .page { width: 100%; }\n  a { color: inherit; }\n\n  /* ── Eyebrow ─────────────────────────────────────────────── */\n  .eyebrow {\n    display: flex; align-items: center; gap: 10px;\n    font-family: var(--mono);\n    font-size: 12px; font-weight: 700;\n    letter-spacing: 0.32em; text-transform: uppercase;\n  }\n  .eyebrow .tick { width: 9px; height: 9px; display: inline-block; }\n\n  /* ── Hero ────────────────────────────────────────────────── */\n  .hero {\n    position: relative;\n    min-height: 100vh;\n    display: flex; flex-direction: column;\n    align-items: center; justify-content: center;\n    overflow: hidden;\n    padding: 4vh 24px 0;\n  }\n  .hero-content {\n    position: relative; z-index: 5;\n    text-align: center;\n    max-width: 720px;\n    display: flex; flex-direction: column; align-items: center;\n    gap: 22px;\n  }\n  .eyebrow { justify-content: center; }\n  .hero-name {\n    font-family: var(--pixel);\n    font-size: clamp(38px, 8.5vw, 92px);\n    line-height: 1.15;\n    letter-spacing: 0.02em;\n    text-shadow: 5px 5px 0 rgba(43,42,34,0.10);\n  }\n  .hero-name span { display: block; }\n  .hero-sub {\n    font-family: var(--mono);\n    font-size: clamp(13px, 1.4vw, 16px);\n    line-height: 1.75;\n    max-width: 46ch;\n    text-wrap: pretty;\n  }\n  .hero-links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }\n\n  /* Pixel-style button links */\n  .hero-link {\n    font-family: var(--mono);\n    font-size: 13px; font-weight: 700;\n    text-decoration: none;\n    padding: 11px 18px;\n    border: 3px solid currentColor;\n    background: transparent;\n    box-shadow: 5px 5px 0 var(--ac, #b5482f);\n    transition: transform .12s steps(2), box-shadow .12s steps(2);\n    white-space: nowrap;\n  }\n  .hero-link:hover {\n    transform: translate(3px, 3px);\n    box-shadow: 2px 2px 0 var(--ac, #b5482f);\n    color: var(--ac, #b5482f);\n  }\n\n  .scroll-cue {\n    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);\n    z-index: 6;\n    font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em;\n  }\n  .scroll-cue.bob { animation: bob 1.8s steps(3) infinite; }\n\n  /* ── Scene backdrop ──────────────────────────────────────── */\n  .scene { position: absolute; inset: 0; z-index: 1; pointer-events: none; }\n  .clouds { position: absolute; inset: 0; z-index: 2; pointer-events: none; }\n  .cloud { position: absolute; left: 0; }\n  .cloud--drift { animation: drift linear infinite; }\n\n  .sun-wrap {\n    position: absolute; top: 13vh; left: 50%; transform: translateX(-50%);\n    width: 64px; height: 64px;\n  }\n  .sun-glow {\n    position: absolute; left: 50%; top: 50%;\n    width: 260px; height: 260px; transform: translate(-50%, -50%);\n    border-radius: 50%;\n  }\n  .sun-glow--pulse { animation: sunpulse 5s ease-in-out infinite; }\n  .sun { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }\n\n  .ground-band { position: absolute; bottom: 0; left: 0; right: 0; height: 48px; z-index: 1; }\n  .ground-band .pine { position: absolute; bottom: 40px; }\n  .ground-band .bush { position: absolute; bottom: 38px; }\n  .ground-band .rock { position: absolute; bottom: 38px; }\n\n  /* Walking deer — exact gif as a transparent 48-frame sprite sheet, driven\n     by JS (background-position + translateX) so it can pause when lying. */\n  .bear { position: absolute; bottom: 34px; left: 0; z-index: 4; }\n  .deer {\n    width: 163px; height: 131px;\n    background: url(\"9e837ec2-9a5b-4a8a-a4b4-57e5f1b55918\") 0 0 / 7824px 131px no-repeat;\n    image-rendering: pixelated;\n  }\n\n  /* Birds */\n  .birds { position: absolute; inset: 0; z-index: 3; pointer-events: none; }\n  .bird { position: absolute; left: 0; }\n  .bird--fly { animation: drift-rev linear infinite; }\n  .bird-bob { animation: birdwave ease-in-out infinite; }\n  .bird-flap { animation: flap 0.5s steps(2) infinite; }\n\n  /* Layout: SPOTLIGHT — giant sun behind the name */\n  .hero--spotlight .sun-wrap { top: 46%; }\n  .hero--spotlight .sun { transform: translate(-50%, -50%) scale(3.4); }\n  .hero--spotlight .sun-glow { width: 520px; height: 520px; }\n  .hero--spotlight .cloud:nth-child(2),\n  .hero--spotlight .cloud:nth-child(3) { display: none; }\n\n  /* Layout: MINIMAL — content lower-left, lots of empty sky */\n  .hero--minimal { align-items: flex-start; justify-content: flex-end; padding-bottom: 16vh; }\n  .hero--minimal .hero-content { text-align: left; align-items: flex-start; padding-left: 4vw; }\n  .hero--minimal .eyebrow { justify-content: flex-start; }\n  .hero--minimal .sun-wrap { top: 10vh; left: auto; right: 9vw; transform: none; }\n  .hero--minimal .cloud:nth-child(1),\n  .hero--minimal .cloud:nth-child(4) { display: none; }\n\n  /* ── Projects ────────────────────────────────────────────── */\n  .projects { position: relative; padding: 92px 24px 56px; }\n  .projects-head { text-align: center; }\n  .projects-title {\n    font-family: var(--pixel);\n    font-size: clamp(18px, 2.8vw, 30px);\n    margin-top: 20px;\n    letter-spacing: 0.01em;\n  }\n  /* One project per row: live-site frame on one side, hook + subtitle on the\n     other — sides alternate per row (.proj-row--flip). */\n  .proj-list {\n    position: relative; z-index: 3;\n    display: flex; flex-direction: column;\n    gap: clamp(56px, 8vw, 88px);\n    max-width: 1060px; margin: 72px auto 0;\n  }\n  .proj-row {\n    display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);\n    gap: clamp(28px, 4.5vw, 60px);\n    align-items: center;\n  }\n  .proj-row--flip { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }\n  .proj-row--flip .proj-embed { order: 2; }\n  .proj-row--flip .proj-copy { order: 1; }\n\n  /* Pixel browser frame around the live embed */\n  .proj-frame {\n    border: 3px solid #2b2a22;\n    background: #0d1226;\n    box-shadow: 8px 8px 0 var(--ac);\n    transition: transform .14s steps(2), box-shadow .14s steps(2);\n  }\n  .proj-frame:hover { transform: translate(-2px, -2px); box-shadow: 10px 10px 0 var(--ac); }\n  .proj-chrome {\n    display: flex; align-items: center; gap: 7px;\n    padding: 9px 11px;\n    background: rgba(245,242,226,0.96);\n    border-bottom: 3px solid #2b2a22;\n  }\n  .pc-dot { width: 8px; height: 8px; }\n  .pc-url {\n    margin-left: 7px; min-width: 0;\n    font-family: var(--mono); font-size: 10.5px; font-weight: 700;\n    letter-spacing: 0.06em; color: #2b2a22;\n    padding: 3px 8px;\n    background: #e7e2cb; border: 2px solid #2b2a22;\n    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n  }\n  .proj-screen { position: relative; overflow: hidden; aspect-ratio: 16 / 10; }\n  .proj-iframe {\n    position: absolute; top: 0; left: 0;\n    width: 1280px; height: 800px; border: 0;\n    transform-origin: 0 0;\n    pointer-events: none; /* preview only — the overlay link opens the site */\n    background: #fff;\n    transition: opacity .35s;\n  }\n  .proj-screen-link {\n    position: absolute; inset: 0; z-index: 2;\n    display: flex; align-i
