<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Next · Overlap</title>
<meta name="description" content="Tell us what Overlap should do next.">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/overlap/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   Meet on time — iOS-light design system.
   One ink (black), one paper (white), one ground (#F2F2F7).
   Everything else is opacity.
   ───────────────────────────────────────────────────────────── */
:root{
  --wruler:26px; --wsum:34px; --wrow:40px; --cw:34px; --lab:102px;
  --paper:#FFFFFF;
  --ground:#F2F2F7;
  --ink:#000000;
  --ink-2:rgba(60,60,67,.60);
  --ink-3:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.29);
  --fill:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.20);
  --radius:14px;
  --dock-h:calc(72px + env(safe-area-inset-bottom));
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ground);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font);font-size:17px;line-height:1.35;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-optical-sizing:auto;font-synthesis-weight:none;
  overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input{border:0;background:none;outline:none;width:100%}
::selection{background:#000;color:#fff}

.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground)}
.nav-sub,.sechead.desk-only{display:none}

/* ── nav ── */
.nav{position:sticky;top:0;z-index:40;background:rgba(242,242,247,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.nav.scrolled{box-shadow:0 .5px 0 var(--sep)}
.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 10px;min-height:44px}
.nav-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.03em;
  color:var(--ink);text-decoration:none}
.nav-title .rail-mark{width:19px;height:17px;flex:none;--mark-cut:var(--ground)}
.nav-act{font-size:15px;color:var(--ink);opacity:.45}
.nav-act:active{opacity:.25}

/* ── the side ────────────────────────────────────────────────────
   Everything you set — who is in the team, what the meeting is, which
   team you are in. On a desk it is a column pinned to the left; on a
   phone there is no room for a column, so it folds up and sits above
   the schedule instead.
   ──────────────────────────────────────────────────────────────── */
/* On a phone the column has nowhere to go, so it stops being a box: its
   children join the page's own flex flow and take their order from it. */
.rail{display:contents}
.rail-body{padding:0 16px}
.rail-brand{display:none}
.rsec{margin:0 0 14px}
.rhead{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px 8px;text-align:left}
/* the step you are on, numbered where you do it */
.stepn{flex:none;width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-size:11px;font-weight:700;font-style:normal;display:grid;place-items:center;
  letter-spacing:0;font-variant-numeric:tabular-nums}
/* done is quiet, the step you are on is loud, the rest are waiting */
.stepn.done{background:var(--fill-2);color:var(--ink-2)}
.stepn.wait{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.stepn.on{background:var(--ink);color:var(--paper)}
.dock-step{display:flex;align-items:center;justify-content:center;gap:8px;padding-bottom:8px}
.dock-step .stepn{width:18px;height:18px;font-size:10.5px}
.dock-step span{font-size:12px;color:var(--ink-2);letter-spacing:-.005em;text-align:left}
.rhead>span{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.rhead>b{flex:1;min-width:0;font-size:13px;font-weight:400;color:var(--ink-2);letter-spacing:-.005em;
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .fold{width:7px;height:7px;flex:none;border-right:2px solid var(--ink-3);
  border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .2s var(--ease)}
.rsec.open .rhead .fold{transform:rotate(-135deg) translate(-2px,-2px)}
.rsec .rbody{display:none}
.rsec.open .rbody{display:block}
.rsec .row input{text-align:right;flex:1;font-size:17px;letter-spacing:-.02em}
.rail-foot{padding:4px 16px 0;display:flex;flex-direction:column;gap:2px}
.dock-more{display:flex;justify-content:center;gap:14px;padding-top:9px}
.dock-more .linkbtn{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dock-more .linkbtn:active{color:var(--ink)}

/* ── layout ── */
main{flex:1;padding:6px 0 8px}
.step{display:none;animation:fade .3s var(--ease)}
.step.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{padding:0 16px;margin:0 0 30px}

/* ── a section of the page you read ── */
.pane{padding:0 16px;margin:0 0 34px;scroll-margin-top:64px}
.panehead{display:flex;align-items:baseline;gap:10px;padding:0 4px 12px}
.panehead h2{font-size:21px;line-height:1.15;font-weight:700;letter-spacing:-.03em;margin:0}
.panehead .ph-note{flex:1;min-width:0;font-size:13px;color:var(--ink-2);letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panehead .linkbtn{flex:none}
@media (max-width:520px){ .panehead{flex-wrap:wrap;row-gap:2px}
  .panehead .ph-note{order:3;flex-basis:100%} }
.sechead{font-size:13px;color:var(--ink-2);letter-spacing:-.005em;padding:0 4px 10px;display:flex;justify-content:space-between;align-items:flex-end}
.sechead b{font-weight:400}
.sechead.gap{padding-top:28px}
.secfoot{font-size:13px;line-height:1.45;color:var(--ink-2);padding:10px 4px 0}
.card{background:var(--paper);border-radius:var(--radius);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:13px;padding:13px 16px;min-height:58px}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.row.tap{cursor:pointer;transition:background .12s}
.row.tap:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink-2);letter-spacing:-.005em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:17px;color:var(--ink-2);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chev{width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);flex:none;margin-left:2px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600;letter-spacing:0;flex:none}
.avatar.you{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.plus{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;font-size:20px;font-weight:300;color:var(--ink);line-height:1}
.del{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--ink-2);display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.del:active{background:var(--fill-2)}

/* ── buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.02em;transition:transform .12s var(--ease),opacity .12s}
.btn:active{transform:scale(.975);opacity:.85}
.btn[disabled]{opacity:.25;transform:none}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);height:44px;font-weight:400}
.btnrow{display:flex;gap:10px}
.chips{display:flex;gap:9px;flex-wrap:wrap;padding:2px 4px 0}
.chip{padding:8px 15px;border-radius:999px;background:var(--paper);font-size:14px;font-weight:500;letter-spacing:-.01em;box-shadow:inset 0 0 0 1px var(--sep)}
.chip:active{background:var(--fill)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}

/* ── dock ── */
.dock{position:sticky;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(242,242,247,.86);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 -.5px 0 var(--sep)}
.dock-hint{font-size:12px;color:var(--ink-2);text-align:center;padding-bottom:8px;letter-spacing:-.005em}

/* ── the day being looked at ── */
.weekbar{display:flex;align-items:stretch;gap:8px;padding-bottom:10px}
.weekbar .daytabs{flex:1;min-width:0;padding-bottom:0}
.wsteps{display:flex;flex:none;background:var(--fill);border-radius:9px;overflow:hidden}
.wsteps button{width:32px;display:grid;place-items:center;font-size:17px;color:var(--ink)}
.wsteps button:active{background:var(--fill-2)}
.wsteps button+button{box-shadow:inset 1px 0 0 var(--sep)}
.weeksub{font-size:12px;color:var(--ink-2);letter-spacing:-.005em;padding:0 4px 10px}
.daytabs{display:flex;gap:5px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.dtab{flex:none;min-width:46px;padding:5px 9px 6px;border-radius:9px;background:var(--fill);text-align:center;transition:background .15s}
.dtab .wd{display:block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.dtab .dd{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;margin-top:0;font-variant-numeric:tabular-nums}
.dtab.we{opacity:.5}
.dtab.on{background:var(--ink);color:#fff;opacity:1}
.dtab.on .wd{color:rgba(255,255,255,.55)}
.dtab.past{color:var(--ink-3);
  background-image:repeating-linear-gradient(135deg,rgba(60,60,67,.16) 0 2px,transparent 2px 6px)}
.dtab.past .wd{color:var(--ink-3)}
/* ── the schedule ───────────────────────────────────────────────
   Names down the side, the day across the top, one column per hour.
   A column is one instant: the ruler reads it on the reader's clock,
   and every row reads the same instant on a different one. Bars, not
   a chequerboard — contiguous hours join up, the way a calendar draws
   a meeting.
   ─────────────────────────────────────────────────────────────── */
.wtb{display:flex;background:var(--paper);border-radius:var(--radius);overflow:hidden}
.wtblabs{flex:none;width:var(--lab);display:grid;box-shadow:1px 0 0 var(--sep);z-index:3;background:var(--paper)}
.wtbscroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wtbscroll::-webkit-scrollbar{display:none}
.wtbgrid{display:grid;position:relative;min-width:100%}
.wtbgrid.edit{touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}

/* the name column */
.rlab{display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 15px;overflow:hidden}
.rlab b{font-size:14px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlab span{display:flex;align-items:baseline;gap:5px;font-size:11px;color:var(--ink-2);margin-top:1px}
.rlab span em{font-style:normal;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlab span i{font-style:normal;flex:none;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rlab+.rlab{box-shadow:inset 0 -1px 0 rgba(60,60,67,.10)}
.rlab.sum{box-shadow:0 -1px 0 var(--sep),0 1px 0 var(--ink)}
.rlab.head{justify-content:flex-end;padding-bottom:5px}
.rlab.head b{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.rlab.sum b{font-size:15px;font-weight:700;letter-spacing:-.03em}
.rlab.sum span{font-size:12px}

/* the hour ruler */
.tick{display:flex;align-items:flex-end;padding:0 0 5px 4px;font-size:10px;font-weight:600;
  letter-spacing:.01em;color:var(--ink-3);font-variant-numeric:tabular-nums;
  box-shadow:inset 1px 0 0 rgba(60,60,67,.08)}
.tick.q{box-shadow:inset 1px 0 0 rgba(60,60,67,.20)}
.tick.on{color:var(--ink);font-weight:700}

/* one hour, one person */
.hc{position:relative;display:flex;align-items:center;justify-content:center;
  --gl:rgba(60,60,67,.09); --rl:rgba(60,60,67,.10);
  box-shadow:inset 1px 0 0 var(--gl),inset 0 -1px 0 var(--rl)}
.hc.busy,.hc.off{--gl:transparent}
.hc.busy{--rl:rgba(255,255,255,.14)}
.hc.date{box-shadow:inset 1.5px 0 0 var(--ink-3),inset 0 -1px 0 var(--rl);
  justify-content:flex-start;padding-left:4px}
/* the bar itself, inset so a row reads as a track with something laid in it */
.hc.busy::before,.hc.off::before{content:"";position:absolute;left:0;right:0;top:4px;bottom:4px}
.hc.busy::before{background:var(--ink)}
.hc.off::before{background:repeating-linear-gradient(135deg,
  rgba(0,0,0,.24) 0 2px,rgba(0,0,0,.07) 2px 6px)}
.hc.s::before{border-top-left-radius:7px;border-bottom-left-radius:7px;left:1px}
.hc.e::before{border-top-right-radius:7px;border-bottom-right-radius:7px;right:1px}
.hc .n,.hc .dm{position:relative;z-index:1}
.hc .n{font-size:11px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hc .dm{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.hc.busy .n{color:#fff}
.hc.busy .dm{color:rgba(255,255,255,.55)}

/* the team band: paper when everyone can, ink when nobody, and the
   shades between are how many are out */
.hc.sum{background:rgba(0,0,0,var(--k,0));
  box-shadow:inset 1px 0 0 rgba(60,60,67,.12),inset 0 -1px 0 var(--ink)}
.hc.sum.none{background:var(--ink)}
/* an hour the whole team can make gets said out loud */
.hc.sum.all::after{content:"";position:absolute;left:3px;right:3px;bottom:5px;height:4px;
  border-radius:2px;background:var(--ink)}
.hc.sum .n{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--ink);opacity:.62}
.hc.sum.dk .n{color:var(--paper);opacity:.85}
.hc.sum.all .n{opacity:1}
.hc.sum.none .n{color:var(--paper);opacity:.4}
.hc.sum.pick .n{opacity:1}

/* now, and everything before it — struck through rather than painted over,
   so what was underneath still reads */
.pastwash{position:absolute;top:var(--wruler);bottom:0;left:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(135deg,
    rgba(242,242,247,.92) 0 2px,rgba(242,242,247,.22) 2px 6px)}
.nowline{position:absolute;top:var(--wruler);bottom:0;width:1.5px;margin-left:-.75px;
  background:var(--ink);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-3px;left:-2.25px;width:6px;height:6px;
  border-radius:50%;background:var(--ink)}
.colmark{position:absolute;top:0;bottom:0;border:2.5px solid var(--ink);border-radius:10px;
  pointer-events:none;z-index:5;box-shadow:0 0 0 2px var(--paper)}

/* ── who is coming ── */
.row.gst .avatar{opacity:.35;transition:opacity .14s}
.row.gst.on .avatar{opacity:1}
.row.gst .t,.row.gst .s{color:var(--ink-3)}
.row.gst.on .t{color:var(--ink)}
.row.gst.on .s{color:var(--ink-2)}
.row.gst .tick{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--ink-3);transition:background .14s,box-shadow .14s}
.row.gst.on .tick{background:var(--ink);box-shadow:none}
.row.gst.on .tick::after{content:"";width:9px;height:5px;border-left:2px solid #fff;
  border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
/* a row that is not coming stays on the calendar, greyed, so you can see it */
.rlab.notin{opacity:.4}
.hc.notin{opacity:.35}

.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;row-gap:5px;font-size:11px;
  color:var(--ink-2);padding:11px 4px 0;letter-spacing:-.005em}
.legend span{white-space:nowrap}
.legend .sp{flex:1 0 10px}
.legend .lg{width:12px;height:12px;border-radius:3px;display:block;flex:none}
.legend .lg.free{background:var(--paper);box-shadow:inset 0 0 0 1px var(--sep)}
.legend .lg.part{background:repeating-linear-gradient(135deg,
  rgba(0,0,0,.24) 0 2px,rgba(0,0,0,.07) 2px 6px);box-shadow:inset 0 0 0 1px var(--sep)}
.legend .lg.busy{background:var(--ink)}
/* a desk has the width for a wider hour and a longer name */
@media (min-width:600px){ :root{--cw:38px; --lab:124px} }
@media (min-width:900px){ :root{--cw:44px; --lab:152px} }
.linkbtn{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:-.01em;padding:0 2px}
.linkbtn:active{opacity:.4}
.linkbtn.on{color:var(--ink);font-weight:600}

/* ── account, invite, feedback ── */
.caret{width:6px;height:6px;border-right:1.8px solid var(--ink-3);border-bottom:1.8px solid var(--ink-3);
  transform:rotate(45deg) translate(-1px,-1px);flex:none}
.row .mark{font-weight:700;font-size:15px}
.linkbox{padding:14px 16px;font-size:13px;line-height:1.5;word-break:break-all;color:var(--ink-2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sheet-lede{font-size:14px;line-height:1.5;color:var(--ink-2);padding:0 20px 16px;letter-spacing:-.005em}
#fbText{width:100%;border:0;background:none;outline:none;padding:15px 16px;font-size:17px;
  letter-spacing:-.02em;line-height:1.45;resize:vertical;min-height:110px;font-family:var(--font)}
#fbText::placeholder{color:var(--ink-3)}
textarea{font-family:var(--font)}

/* ── slot cards ── */
.slot{display:flex;align-items:center;gap:14px;padding:15px 16px;position:relative;width:100%;text-align:left}
.slot+.slot::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.slot:active{background:var(--fill)}
.slot .radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3);flex:none;display:grid;place-items:center;transition:box-shadow .15s}
.slot.on .radio{background:var(--ink);box-shadow:none}
.slot.on .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.slot .when{flex:1;min-width:0}
.slot .when,.slot .w1,.slot .w2{display:block}
.slot .w1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.slot .w2{font-size:13px;color:var(--ink-2);margin-top:3px;letter-spacing:-.005em;line-height:1.5}
.slot .w1s{font-weight:400;color:var(--ink-2);font-size:15px}
.slot .lt b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.slot .lt .nd{font-style:normal;font-size:10px;font-weight:700;vertical-align:.35em;
  margin-left:1px;color:var(--ink-2)}
.slot .lt.out{opacity:.5}
.slot .lt.out b{color:var(--ink-2);font-weight:500}
.slot .sep{font-style:normal;opacity:.3;margin:0 5px}
.badge{font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 8px;border-radius:6px;background:var(--fill);color:var(--ink-2);white-space:nowrap}
.badge.all{background:var(--ink);color:#fff}
.empty{text-align:center;padding:40px 24px;color:var(--ink-2);font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:50;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--ground);border-radius:14px 14px 0 0;max-height:90dvh;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .42s var(--ease);max-width:520px;margin:0 auto}
@media (min-width:900px){ .sheet{max-width:720px} }
.sheet.on{transform:none;pointer-events:auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:6px auto 2px;flex:none}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;flex:none}
.sheet-nav .t{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheet-nav button{font-size:17px;letter-spacing:-.01em}
.sheet-nav button.p{font-weight:600}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(20px + env(safe-area-inset-bottom))}
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;padding:8px 10px;margin:0 16px 14px}
.search svg{flex:none;opacity:.42}
.search input{font-size:17px;letter-spacing:-.02em}
.search input::placeholder{color:var(--ink-2)}
.field{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;position:relative}
.field+.field::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.field label{width:76px;flex:none;font-size:17px;letter-spacing:-.02em}
.field input{font-size:17px;letter-spacing:-.02em}
.stepper{display:flex;background:var(--fill);border-radius:8px;overflow:hidden}
.stepper button{width:38px;height:32px;display:grid;place-items:center;font-size:18px;line-height:1}
.stepper button:active{background:var(--fill-2)}
.stepper span{width:1px;background:var(--sep)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill-2);position:relative;transition:background .25s var(--ease);flex:none}
.switch.on{background:var(--ink)}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .28s var(--ease)}
.switch.on i{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:rgba(0,0,0,.92);color:#fff;font-size:14px;font-weight:500;letter-spacing:-.01em;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:60;backdrop-filter:blur(10px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--ink-3);padding:10px 24px 28px;line-height:1.6}
.foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--ink-3)}
/* ── a wider phone, a tablet ── */
@media (min-width:820px){
  .app{max-width:760px}
  .nav-sub{display:inline;flex:1;font-size:13px;color:var(--ink-2);letter-spacing:-.005em}
  .dock{padding:12px 16px 16px}
  .dock .btn{max-width:420px;margin:0 auto}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:440px;max-width:440px;margin:0;
         border-radius:16px;max-height:84vh;opacity:0;
         transform:translate(-50%,-48%) scale(.97);
         transition:transform .3s var(--ease),opacity .22s ease}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .grab{display:none}
  .sheet-nav{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ═══════════════════════════════════════════════════════════
   The desk. The controls lift out of the page and become a
   column down the left; what is left in the middle is only the
   things you read — the schedule, the hours, the question.
   ═══════════════════════════════════════════════════════════ */
@media (min-width:900px){
  .rail{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:288px;
    z-index:45;padding:22px 0 0;background:var(--paper);box-shadow:1px 0 0 var(--sep)}
  .rail-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px 18px;scrollbar-width:thin}
  .rail-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;
    letter-spacing:-.035em;color:var(--ink);text-decoration:none;padding:0 8px 22px}
  .rail-mark{width:26px;height:23px;flex:none;color:var(--ink);--mark-cut:var(--paper)}
  .rsec{margin:0 0 20px}
  .rhead{padding:2px 4px 9px}
  .rsec .card{background:var(--ground)}
  /* a column is narrower than a page, so the rows go quieter to fit it */
  .rsec .row{min-height:46px;padding:8px 12px;gap:10px}
  .rsec .row+.row::before{left:12px}
  .rlab.sum b{font-size:17px;letter-spacing:-.025em}
  .rsec .row .t{font-size:15px}
  .rsec .row .s{font-size:12px}
  .rsec .row input{font-size:15px}
  .rsec .avatar,.rsec .plus{width:28px;height:28px;font-size:11px}
  .rsec .del{width:22px;height:22px;font-size:13px}
  /* four chips and a label do not both fit a column, so they stop sharing a line */
  .rsec .row.stack{flex-direction:column;align-items:stretch;gap:7px}
  .rsec .row.stack .grow{flex:none}
  .rsec .chips{gap:6px}
  .rsec .chip{padding:6px 12px;font-size:13px;background:var(--paper)}
  .rsec .chip.on{background:var(--ink);color:#fff}
  .rsec .stepper button{width:32px;height:28px;font-size:16px}
  .rsec .secfoot{font-size:12px;padding-top:8px}

  .rail-foot{flex:none;padding:8px 16px 14px;background:var(--paper);
    box-shadow:0 -1px 0 var(--sep)}
  /* the button that makes the thing sits with the thing */
  .dock{position:static;flex:none;padding:14px 16px 12px;background:var(--paper);
    box-shadow:0 -1px 0 var(--sep);backdrop-filter:none;-webkit-backdrop-filter:none}
  .dock .btn{height:48px;font-size:16px;max-width:none;margin:0}
  .dock-hint{font-size:12px;padding-bottom:9px}
  .rail-team{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;width:100%;
    text-align:left;text-decoration:none;color:var(--ink);transition:background .14s}
  .rail-team:hover{background:var(--fill)}
  .rail-team .avatar,.rail-team .plus{width:28px;height:28px;font-size:11px}
  .rail-team .rail-tx{min-width:0;flex:1}
  .rail-team .rail-tx b{display:block;font-size:14px;font-weight:600;letter-spacing:-.02em}
  .rail-team .rail-tx span{display:block;font-size:12px;color:var(--ink-2);letter-spacing:-.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-team .caret{margin-left:auto}

  /* the page moves over and keeps only what it is for */
  .app{margin-left:288px;max-width:none;padding:0 36px}
  .rail-brand{padding:0 24px 22px}
  .nav{background:rgba(242,242,247,.86)}
  .nav-bar{padding:16px 0 12px}
  .nav-title{display:none}
  main,.foot{max-width:none;width:100%}
  #planSec{max-width:1080px}          /* a list is not improved by being a metre wide */
  .pane{padding:0;margin:0 0 42px}
  .panehead h2{font-size:26px}
  .panehead{padding-bottom:14px}
  /* a form is not improved by being a metre wide */
  #nextSec{max-width:660px}
}
@media (min-width:1280px){ .app{padding:0 56px} }

/* the phone keeps the controls in the flow: folded up, above the schedule,
   with the team and the account after everything else */
@media (max-width:899px){
  .app{display:flex;flex-direction:column}
  .nav{order:1} .rail-body{order:2} main{order:3}
  .rail-foot{order:4;margin-top:6px} .dock{order:5} .foot{order:6}
  .rail-foot .rail-team{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    text-decoration:none;color:var(--ink);background:var(--paper);padding:12px 16px;min-height:56px}
  .rail-foot .rail-team:first-child{border-radius:var(--radius) var(--radius) 0 0}
  .rail-foot .rail-team:last-child{border-radius:0 0 var(--radius) var(--radius)}
  .rail-foot .rail-team+.rail-team{box-shadow:inset 0 1px 0 var(--sep)}
  .rail-foot .rail-tx{flex:1;min-width:0}
  .rail-foot .rail-tx b{display:block;font-size:16px;font-weight:500;letter-spacing:-.02em}
  .rail-foot .rail-tx span{display:block;font-size:13px;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-foot .caret{margin-left:auto}
}

/* ── answering an invite: one screen, one question ── */
.respond-only,.respond-only.on{display:none}
body.responding .respond-only{display:block}
body.responding .rail,
body.responding .rail-foot,
body.responding #planSec,
body.responding #nextSec,
body.responding .nav-act{display:none}
body.responding .app{margin-left:0;padding:0}
body.responding #overlapSec{display:block;padding:0 16px}
body.responding #overlapSec .panehead{display:none}
body.responding #editToggle{display:none}
body.responding main,
body.responding .dock,
body.responding .foot{max-width:760px;margin-left:auto;margin-right:auto}

</style>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Overlap. One screen: the meeting down the side in three numbered
   steps, the calendar in the middle, and the hour you pick on it.
   team/, plan/ and next/ all resolve; next/ opens the question.
   ═══════════════════════════════════════════════════════════════════ */
document.getElementById("root").innerHTML = "<div class=\"app\">\n\n  <header class=\"nav\" id=\"nav\">\n    <div class=\"nav-bar\">\n      <a class=\"nav-title\" href=\"/overlap/\"><svg class=\"rail-mark\" viewBox=\"0 0 64 56\" aria-hidden=\"true\"><g fill=\"currentColor\"><rect x=\"4\" y=\"13\" width=\"9\" height=\"30\" rx=\"4.5\"/><rect x=\"18\" y=\"4\" width=\"9\" height=\"48\" rx=\"4.5\"/><rect x=\"32\" y=\"17\" width=\"9\" height=\"22\" rx=\"4.5\"/><rect x=\"46\" y=\"9\" width=\"9\" height=\"38\" rx=\"4.5\"/></g><rect x=\"1\" y=\"24\" width=\"61\" height=\"7\" rx=\"3.5\" fill=\"var(--mark-cut,#fff)\"/></svg>Overlap</a>\n      <span class=\"nav-sub\">The hour that works for everyone.</span>\n      <button class=\"nav-act\" id=\"shareTop\">Share</button>\n    </div>\n  </header>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 the side: everything you set, nothing you read \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <aside class=\"rail\" id=\"rail\">\n    <a class=\"rail-brand\" href=\"/overlap/\"><svg class=\"rail-mark\" viewBox=\"0 0 64 56\" aria-hidden=\"true\"><g fill=\"currentColor\"><rect x=\"4\" y=\"13\" width=\"9\" height=\"30\" rx=\"4.5\"/><rect x=\"18\" y=\"4\" width=\"9\" height=\"48\" rx=\"4.5\"/><rect x=\"32\" y=\"17\" width=\"9\" height=\"22\" rx=\"4.5\"/><rect x=\"46\" y=\"9\" width=\"9\" height=\"38\" rx=\"4.5\"/></g><rect x=\"1\" y=\"24\" width=\"61\" height=\"7\" rx=\"3.5\" fill=\"var(--mark-cut,#fff)\"/></svg>Overlap</a>\n    <div class=\"rail-body\">\n\n    <section class=\"rsec\" id=\"meetSec\">\n      <button class=\"rhead\" data-fold=\"meetSec\">\n        <i class=\"stepn\" id=\"s1\">1</i><span>Name it</span><b id=\"meetSum\"></b><i class=\"fold\"></i>\n      </button>\n      <div class=\"rbody\">\n        <div class=\"card\">\n          <div class=\"row\">\n            <div class=\"grow\"><div class=\"t\">Name</div></div>\n            <input id=\"titleInput\" placeholder=\"Intro call\" maxlength=\"80\">\n          </div>\n          <div class=\"row\">\n            <div class=\"grow\"><div class=\"t\">Length</div></div>\n            <div class=\"stepper\"><button data-dur=\"-\">\u2212</button><span></span><button data-dur=\"+\">+</button></div>\n            <div class=\"v\" id=\"durVal\" style=\"width:64px;text-align:right;font-variant-numeric:tabular-nums\"></div>\n          </div>\n        </div>\n        <div class=\"secfoot\" id=\"meetFoot\"></div>\n      </div>\n    </section>\n\n    <section class=\"rsec\" id=\"linkSec\">\n      <button class=\"rhead\" data-fold=\"linkSec\">\n        <i class=\"stepn\" id=\"s2\">2</i><span>Get the link</span><b id=\"linkSum\"></b><i class=\"fold\"></i>\n      </button>\n      <div class=\"rbody\">\n        <div class=\"card\" id=\"linkCard\"></div>\n        <div class=\"secfoot\" id=\"linkFoot\"></div>\n      </div>\n    </section>\n\n    <section class=\"rsec\" id=\"peopleSec\">\n      <button class=\"rhead\" data-fold=\"peopleSec\">\n        <i class=\"stepn\" id=\"s3\">3</i><span>Wait for them</span><b id=\"peopleCount\"></b><i class=\"fold\"></i>\n      </button>\n      <div class=\"rbody\">\n        <div class=\"card\" id=\"peopleList\"></div>\n        <div class=\"secfoot\" id=\"guestFoot\"></div>\n      </div>\n    </section>\n    </div>\n\n    <div class=\"dock\">\n      <div class=\"dock-step\"><i class=\"stepn\" id=\"dockStep\">4</i><span id=\"dockHint\"></span></div>\n      <button class=\"btn\" id=\"primary\">Continue</button>\n      <div class=\"dock-more\">\n        <button class=\"linkbtn\" id=\"hoursBtn\">My hours</button>\n        <button class=\"linkbtn\" id=\"icsBtn\">Apple Calendar</button>\n      </div>\n    </div>\n\n    <div class=\"rail-foot\" id=\"railFoot\"></div>\n  </aside>\n\n  <main>\n\n    <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 the schedule \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n    <section class=\"pane\" id=\"overlapSec\">\n      <div class=\"panehead\">\n        <h2>Calendar</h2>\n        <span class=\"ph-note\" id=\"gridTz\"></span>\n        <button class=\"linkbtn\" id=\"editToggle\">Edit hours</button>\n      </div>\n      <div class=\"weekbar\">\n        <div class=\"daytabs\" id=\"dayTabs\"></div>\n        <div class=\"wsteps\">\n          <button id=\"winPrev\" aria-label=\"Earlier week\">\u2039</button>\n          <button id=\"winNext\" aria-label=\"Later week\">\u203a</button>\n        </div>\n      </div>\n      <div class=\"weeksub\" id=\"windowSub\"></div>\n      <div class=\"wtb\">\n        <div class=\"wtblabs\" id=\"wtbLabs\"></div>\n        <div class=\"wtbscroll\" id=\"wtbScroll\"><div class=\"wtbgrid\" id=\"wtb\"></div></div>\n      </div>\n      <div class=\"legend\">\n        <i class=\"lg free\"></i><span>can meet</span>\n        <i class=\"lg part\"></i><span>off hours</span>\n        <i class=\"lg busy\"></i><span>asleep or busy</span>\n      </div>\n      <div class=\"secfoot\" id=\"editFoot\"></div>\n    </section>\n\n  </main>\n\n  <p class=\"foot\" id=\"foot\"></p>\n</div>\n\n<div class=\"scrim\" id=\"scrim\"></div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SHEET \u00b7 your day, given once \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div class=\"sheet\" id=\"sheet\">\n  <div class=\"grab\"></div>\n  <div class=\"sheet-nav\">\n    <button id=\"sheetCancel\">Cancel</button>\n    <span class=\"t\" id=\"sheetTitle\">Your day</span>\n    <button class=\"p\" id=\"sheetDone\">Done</button>\n  </div>\n  <div class=\"sheet-body\">\n    <p class=\"sheet-lede\" id=\"sheetLede\">Answer this once. Every meeting after this starts with it already filled in.</p>\n    <div class=\"sechead\" style=\"padding:0 20px 7px\"><span>Working hours</span></div>\n    <div style=\"padding:0 16px 14px\">\n      <div class=\"card\">\n        <div class=\"field\"><label>From</label><div class=\"grow\"></div><div class=\"stepper\"><button data-h=\" }
function pname(p){ return p.name || (p.you?"You":tzCity(p.tz)); }
var toastT;

function haptic(){ if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){} }

/* ═══════════════ persistence ═══════════════ */
function packed(){

    ng:S.nogo,mid:S.mid,p:peopleArr()};

function unpack(o){

/* The link that matters is the meeting's, and the server mints it. There is

/* ═══════════════ render — step 1, who ═══════════════ */

/* ═══════════════ render — the overlap strip ═══════════════ */
/* A column is one instant. Each row reads that instant on that person's clock:
   white = they can, black = they can't. The last row is everyone at once. */
function dayIndex(ts){
  var tz=dispTz(), days=dayStarts(), k=dayKey(ts,tz), i;
  for(i=0;i<days.length;i++) if(dayKey(days[i],tz)===k) return i;
  return -1;
}
function renderDays(){
  var tz=dispTz(), days=dayStarts(), now=Date.now();
  $("#dayTabs").innerHTML=days.map(function(t,i){
    var z=zp(t,tz), d=dow(t,tz), today=dayKey(t,tz)===dayKey(now,tz);
    var over=(t+86400000)<=now;
    return '<button class="dtab'+(i===S.day?" on":"")+((d===0||d===6)?" we":"")+
      (over?" past":"")+'" data-day="'+i+'"><span class="wd">'+(today?"today":WD[d])+
      '</span><span class="dd">'+z.d+"</span></button>";
  }).join("");
}
/* how far ahead of the reader someone lives, at this day: "+2h", "−5:30" */
function relOffset(p,ts,tz){
  var d=(off(ts,p.tz)-off(ts,tz))/60;
  if(!d) return "";
  var s=d<0?"−":"+", a=Math.abs(d), h=Math.floor(a), m=Math.round((a-h)*60);
  return s+h+(m?":"+pad(m):"")+"h";
}
/* the hour a person reads off their own clock at this instant */
function localHour(ts,tz){
  var z=zp(ts,tz);
  return fmtHourShort(z.H)+(z.M?":"+pad(z.M):"");
}
/* The calendar is the page, so it takes the height the window can spare.
   Rows grow to fill it and the band grows fastest, because it is the answer;
   past a big team they stop growing and the page scrolls instead. */
function sizeGrid(n){
  var wrap=$(".wtb"), top=wrap.getBoundingClientRect().top;
  var reserve=window.innerWidth>=900?96:172;   /* legend, footnote, the dock on a phone */
  var avail=window.innerHeight-top-reserve;
  var ruler=28;
  if(!(avail>200)) avail=200;                  /* a short window just scrolls */
  var band=Math.max(72,Math.min(132,avail*.17));
  var row=Math.max(40,Math.min(140,(avail-ruler-band)/n));
  wrap.style.setProperty("--wruler",Math.round(ruler)+"px");
  wrap.style.setProperty("--wrow",Math.round(row)+"px");
  wrap.style.setProperty("--wsum",Math.round(band)+"px");
}
function renderWTB(){
  var tz=dispTz(), days=dayStarts();
  if(S.day>=DAYS||S.day<0) S.day=0;
  var day=days[S.day], z=zp(day,tz), now=Date.now();
  var total=guests().length;              /* who counts */
  var g=$("#wtb"), labs=$("#wtbLabs"), i, html="", lhtml="", stamps=[];
  sizeGrid(S.people.length);
  var rows="var(--wruler) var(--wsum) repeat("+S.people.length+",var(--wrow))";
  g.style.gridTemplateColumns="repeat(24,minmax(var(--cw),1fr))";
  g.style.gridTemplateRows=rows;
  labs.style.gridTemplateRows=rows;
  for(i=0;i<24;i++) stamps.push(wall(z.y,z.m,z.d,i,0,tz));
  var picked=sel(), pick=-1;
  for(i=0;i<24;i++) if(stamps[i]===picked) pick=i;

  /* ── the ruler: the day, once, on the reader's own clock ── */
  lhtml+='<div class="rlab head"><b>'+esc(tzCity(tz))+"</b></div>";
  for(i=0;i<24;i++){
    var rh=zp(stamps[i],tz).H;
    html+='<div class="tick'+(rh%6===0?" q":"")+(i===pick?" on":"")+'">'+
          (rh%2===0||i===pick?fmtHourShort(rh):"")+"</div>";
  }

  /* ── the band: the whole team at once. It darkens as fewer can make it ── */
  lhtml+='<div class="rlab sum"><b>Everyone</b><span>'+
         (total===S.people.length?total+(total===1?" person":" people")
                                 :total+" of "+S.people.length+" invited")+"</span></div>";
  for(i=0;i<24;i++) html+=sumCell(stamps[i],i,pick);

  /* ── one row per person, drawn as bars, not as a chequerboard ── */
  S.people.forEach(function(p){
    var city=tzCity(p.tz), rel=relOffset(p,day,tz), out=!invited(p);
    lhtml+='<div class="rlab'+(out?" notin":"")+'"><b>'+esc(pname(p))+"</b><span><em>"+
           esc(pname(p)===city?tzLabel(p.tz,day):city)+"</em>"+
           (rel?"<i>"+esc(rel)+"</i>":"")+"</span></div>";
    var prev=null;
    for(i=0;i<24;i++){
      var ts=stamps[i], st=pstate(p,ts),
          next=(i<23)?pstate(p,stamps[i+1]):null,
          nd=(i>0)&&dayKey(ts,p.tz)!==dayKey(stamps[i-1],p.tz),
          cls="hc"+(st==="free"?"":(st==="off"?" off":" busy"))+
              (st!==prev?" s":"")+(st!==next?" e":"")+
              (nd?" date":"")+(ts+3600000<now?" past":"")+(i===pick?" pick":"")+
              (out?" notin":"");
      html+='<div class="'+cls+'" data-ts="'+ts+'" data-col="'+i+
            '" data-p="'+p.id+'">'+
            (i===pick?'<span class="n">'+localHour(ts,p.tz)+"</span>":
             nd?'<span class="dm">'+WD[dow(ts,p.tz)]+"</span>":"")+"</div>";
      prev=st;
    }
  });

  g.innerHTML=html; labs.innerHTML=lhtml;
  g.classList.toggle("edit",editing);

  /* a column is only as wide as the room allows, so measure one */
  var cw=g.firstElementChild?g.firstElementChild.getBoundingClientRect().width:36;

  /* hours already gone, greyed in one stroke rather than cell by cell */
  if(dayKey(now,tz)===dayKey(day,tz)){
    var q=zp(now,tz), h=q.H+q.M/60;
    var wash=document.createElement("div");
    wash.className="pastwash";
    wash.style.width=(h*cw).toFixed(1)+"px";
    g.appendChild(wash);
    var line=document.createElement("div");
    line.className="nowline";
    line.style.left=(h*cw).toFixed(1)+"px";
    g.appendChild(line);
  }

  markColumn(true);
  if(!g.querySelector(".colmark")){
    var bc=8, bn=-1, sc=$("#wtbScroll");
    for(i=0;i<24;i++){ var c=countFor(stamps[i],S.dur); if(c>bn){ bn=c; bc=i; } }
    sc.scrollLeft=Math.max(0,bc*cw-sc.clientWidth/2+cw/2);
  }
  var whole=0;
  for(i=0;i<24;i++) if(countFree(stamps[i])===total) whole++;
  $("#gridTz").textContent=!total?"nobody is invited"
    :total<2?fmtDate(day,tz)
    :(whole?whole+(whole===1?" hour suits":" hours suit"):"no hour suits")+" all "+total;
  $("#editToggle").textContent=editing?"Done":"Edit hours";
  $("#editToggle").classList.toggle("on",editing);
  $("#editFoot").textContent=editing
    ? "Drag along someone's row to take hours away or give them back."
    : "";
}
/* how much of the team is out, as ink: 0 is everyone free and paper white,
   1 is nobody and solid ink. The curve is bent so that losing one of five
   still reads as a good hour, and losing four does not. */
function outWeight(n,total){
  if(!total||!n) return 1;
  return Math.pow(1-n/total,1.7)*.92;
}
/* one hour of the team band */
function sumCell(ts,i,pick){
  var total=guests().length, n=countFree(ts), k=outWeight(n,total);
  return '<div class="hc sum'+(n===0?" none":(n===total?" all":""))+(k>.55?" dk":"")+
    (ts+3600000<Date.now()?" past":"")+(i===pick?" pick":"")+
    '" data-ts="'+ts+'" data-col="'+i+'" style="--k:'+k.toFixed(3)+'">'+
    (total?'<span class="n">'+n+"</span>":"")+"</div>";
}
function markColumn(scrollTo){
  var g=$("#wtb"), old=g.querySelector(".colmark"), t=sel();
  if(old) old.parentNode.removeChild(old);
  if(!t) return;
  var cell=g.querySelector('.hc[data-ts="'+t+'"]');
  if(!cell) return;                       /* the choice sits on another day */
  var m=document.createElement("div");
  m.className="colmark";
  m.style.left=cell.offsetLeft+"px";
  m.style.width=cell.offsetWidth+"px";
  g.appendChild(m);
  if(scrollTo){
    var sc=$("#wtbScroll"), x=cell.offsetLeft-sc.clientWidth/2+cell.offsetWidth/2;
    sc.scrollLeft=Math.max(0,x);
  }
}
function refreshSum(col,ts){
  var c=$("#wtb").querySelector('.hc.sum[data-col="'+col+'"]');
  if(!c) return;
  var total=guests().length, n=countFree(ts), pick=c.classList.contains("pick");
  var k=outWeight(n,total);
  c.className="hc sum"+(n===0?" none":(n===total?" all":""))+(k>.55?" dk":"")+
    (ts+3600000<Date.now()?" past":"")+(pick?" pick":"");
  c.style.setProperty("--k",k.toFixed(3));
  c.innerHTML=total?'<span class="n">'+n+"</span>":"";
}

/* ═══════════════ backend ═══════════════
   Convex over its HTTP API — plain fetch, no SDK, no build step. Set
   window.OVERLAP_CONVEX_URL (see overlap/README.md) and the app goes live:
   real accounts, real meetings, links that survive a new device.

   Without one there is nothing to sign in to, so the app falls back to this
   browser alone. That is a workbench, not a product: no link works.
   ═════════════════════════════════════════ */
var CONVEX = (window.OVERLAP_CONVEX_URL||"").replace(/\/+$/,"");
var LIVE = /^https?:\/\//.test(CONVEX);
var TOKKEY="overlap.token", QKEY="overlap.queue";
var ME=null;        /* {user,profile,meetings} once signed in */
var MEET=null;      /* the meeting on screen */
var PEEP=[];        /* people you have met with, whoever invited whom */

/* one endpoint, one shape: {op,args} in, {ok,value} out. See convex/http.ts.
   Ten seconds is the whole patience budget: a hung request must fail loudly
   rather than leave a button looking like it did nothing. */
function cx(op,args){
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); },10000);
  return fetch(CONVEX+"/overlap",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({op:op,args:args||{}}),
    signal: ctl?ctl.signal:undefined
  }).then(function(r){ return r.json(); }).then(function(j){
    clearTimeout(timer);
    if(j&&j.ok) return j.value;
    throw new Error((j&&j.error)||"Something went wrong");
  },function(e){
    clearTimeout(timer);
    throw new Error(e&&e.name==="AbortError" ? "The server did not answer" : "Can’t reach the server");
  });
}
function token(){ try{ return localStorage.getItem(TOKKEY)||""; }catch(e){ return ""; } }
function setToken(t){
  try{ t?localStorage.setItem(TOKKEY,t):localStorage.removeItem(TOKKEY); }catch(e){}
}
function signedIn(){ return !!(LIVE && ME && ME.user && token()); }
/* Signed in and having said what your day looks like are two different
   things. Everything waits on the second. */
function ready(){ return !LIVE || (signedIn() && ME.profile && ME.profile.ready); }
function inMeeting(){ return !!(signedIn() && MEET); }

/* people <- participants, so the server is the one truth once signed in */
function adoptSeats(list){
  S.people=(list||[]).map(function(m){
    var p=newPerson(m.name,m.tz,!!m.isYou);
    p.pid=m._id; p.email=m.email||""; p.s=m.startHour; p.e=m.endHour; p.wknd=!!m.weekends;
    if(m.sleepStart!=null) p.sl=m.sleepStart;
    if(m.sleepEnd!=null) p.sw=m.sleepEnd;
    p.gcal=m.gcal||0;
    (m.overrides||[]).forEach(function(o){ p.ov[o.ts]=o.free; });
    (m.busy||[]).forEach(function(ts){ p.busy[ts]=1; });
    return p;
  });
  if(!S.people.length) S.people=[newPerson("You",LOCAL_TZ,true)];
  if(!byId(S.dispId)) S.dispId=(meRow()||S.people[0]).id;
}
function refreshMe(){
  if(!LIVE||!token()) return Promise.resolve(null);
  return cx("me",{token:token(),meetingId:S.mid||undefined}).then(function(r){
    ME=r;
    if(!r) return null;
    MEET=r.meeting||null;
    PEEP=r.contacts||[];
    if(MEET){
      S.mid=MEET.id;
      S.title=MEET.title||"";
      S.dur=MEET.durationMin||60;
      if(MEET.startsAt) S.pick=MEET.startsAt;
      adoptSeats(r.participants);
    } else {
      S.mid="";
      /* signed in with nothing on the go: one row, yours, from your profile */
      var me=newPerson(r.user.name,(r.profile&&r.profile.tz)||LOCAL_TZ,true);
      applyProfile(me,r.profile);
      me.email=r.user.email||"";
      S.people=[me]; S.dispId=me.id;
    }
    return r;
  }).catch(function(){ ME=null; MEET=null; setToken(""); return null; });
}
function applyProfile(p,pr){
  if(!pr) return p;
  if(pr.tz) p.tz=pr.tz;
  if(pr.startHour!=null) p.s=pr.startHour;
  if(pr.endHour!=null) p.e=pr.endHour;
  p.wknd=!!pr.weekends;
  if(pr.sleepStart!=null) p.sl=pr.sleepStart;
  if(pr.sleepEnd!=null) p.sw=pr.sleepEnd;
  return p;
}
function hoursArgs(p){
  var ov=[], k;
  for(k in p.ov) if(p.ov.hasOwnProperty(k)) ov.push({ts:+k,free:!!p.ov[k]});
  var busy=[],b;
  for(b in p.busy||{}) if(p.busy.hasOwnProperty(b)) busy.push(+b);
  return {tz:p.tz,startHour:p.s,endHour:p.e,weekends:!!p.wknd,
          sleepStart:p.sl==null?23:p.sl,sleepEnd:p.sw==null?7:p.sw,
          overrides:ov,busy:busy,gcal:p.gcal||0};
}
/* Your row, and only ever your row. Nobody edits anybody else now. */
function syncPerson(p){
  if(!inMeeting()||!p||!p.you) return Promise.resolve();
  var a=hoursArgs(p);
  a.token=token(); a.meetingId=S.mid;
  return cx("meet.hours",a).catch(function(e){ toast(e.message); });
}
/* The answer you give once, kept on your account so the next meeting opens
   already filled in. Saved alongside your row in this meeting. */
function saveProfile(p){
  if(!signedIn()) return Promise.resolve();
  var a=hoursArgs(p);
  return cx("meet.profile",{token:token(),tz:a.tz,startHour:a.startHour,
      endHour:a.endHour,weekends:a.weekends,
      sleepStart:a.sleepStart,sleepEnd:a.sleepEnd})
    .then(function(){ if(ME&&ME.profile) ME.profile.ready=true; });
}
function createMeeting(){
  if(!signedIn()) return Promise.reject(new Error("Sign in first"));
  return cx("meet.create",{token:token(),title:S.title.trim(),durationMin:S.dur,tz:LOCAL_TZ})
    .then(function(r){ S.mid=r.id; save(); return refreshMe(); })
    .then(function(){ afterChange(); haptic(); toast("Link ready. Send it to them."); openShare(); });
}
function joinMeeting(code){
  return cx("meet.join",{token:token(),invite:code,tz:LOCAL_TZ})
    .then(function(r){ S.mid=r.id; save(); return refreshMe(); });
}
function switchMeeting(id){
  if(id===S.mid) return;
  S.mid=id; S.pick=null; S.day=0; save();
  refreshMe().then(function(){ afterChange(); toast(MEET?MEET.title:"Switched"); });
}
function renameMeeting(){
  if(!inMeeting()) return;
  cx("meet.rename",{token:token(),meetingId:S.mid,title:S.title.trim(),durationMin:S.dur})
    .catch(function(e){ toast(e.message); });
}
function bookMeeting(ts){
  if(!inMeeting()) return Promise.resolve();
  return cx("meet.book",{token:token(),meetingId:S.mid,startsAt:ts})
    .catch(function(e){ toast(e.message); });
}

/* feedback survives being offline: queued here, flushed on the next call */
function queueFeedback(rec){
  try{
    var q=JSON.parse(localStorage.getItem(QKEY)||"[]");
    q.push(rec); localStorage.setItem(QKEY,JSON.stringify(q.slice(-20)));
  }catch(e){}
}
function flushFeedback(){
  if(!LIVE) return;
  var q=[];
  try{ q=JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){ return; }
  if(!q.length) return;
  var left=q.slice();
  q.reduce(function(chain,rec){
    return chain.then(function(){
      return cx("feedback.send",rec).then(function(){
        left=left.filter(function(x){ return x!==rec; });
      },function(){});
    });
  },Promise.resolve()).then(function(){
    try{ localStorage.setItem(QKEY,JSON.stringify(left)); }catch(e){}
  });
}

/* ═══════════════ Google Calendar ═══════════════
   The page asks Google for a short-lived token with one narrow scope and
   reads free/busy directly. Nothing is stored, no event titles are ever
   requested — only the blocks of time that are already taken. */
var GID=window.OVERLAP_GOOGLE_CLIENT_ID||"";
var gsiReady=false, gTokenClient=null;
function loadGsi(){
  if(!GID||gsiReady) return Promise.resolve(gsiReady);
  return new Promise(function(res){
    var sc=document.createElement("script");
    sc.src="https://accounts.google.com/gsi/client";
    sc.async=true; sc.defer=true;
    sc.onload=function(){ gsiReady=true; res(true); };
    sc.onerror=function(){ res(false); };
    document.head.appendChild(sc);
  });
}
function gToken(){
  return loadGsi().then(function(okGsi){
    if(!okGsi) throw new Error("Google could not be reached");
    return new Promise(function(res,rej){
      gTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:GID,
        scope:"https://www.googleapis.com/auth/calendar.freebusy",
        callback:function(r){
          if(r&&r.access_token) res(r.access_token);
          else rej(new Error("Calendar access was declined"));
        },
        error_callback:function(){ rej(new Error("Calendar access was declined")); }
      });
      gTokenClient.requestAccessToken({prompt:""});
    });
  });
}
/* busy blocks → the hours they cover, in this person's clock */
function markBusy(p,blocks,from,to){
  p.busy={};
  var step=SLOT*60000, ts;
  blocks.forEach(function(b){
    var a=Date.parse(b.start), z=Date.parse(b.end);
    if(isNaN(a)||isNaN(z)) return;
    for(ts=Math.floor(Math.max(a,from)/step)*step; ts<Math.min(z,to); ts+=step) p.busy[ts]=1;
  });
  p.gcal=Date.now();
}
function syncCalendar(p){
  if(!GID) return Promise.reject(new Error("Google is not configured"));
  var days=dayStarts(), from=days[0], to=days[DAYS-1]+86400000;
  return gToken().then(function(tok){
    return fetch("https://www.googleapis.com/calendar/v3/freeBusy",{
      method:"POST",
      headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},
      body:JSON.stringify({
        timeMin:new Date(from).toISOString(),
        timeMax:new Date(to).toISOString(),
        timeZone:p.tz,
        items:[{id:"primary"}]
      })
    });
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.error) throw new Error(j.error.message||"Calendar refused");
    var cal=(j.calendars||{}).primary||{};
    if(cal.errors&&cal.errors.length) throw new Error("That calendar could not be read");
    markBusy(p,cal.busy||[],from,to);
    syncPerson(p);
    afterChange();
    var n=(cal.busy||[]).length;
    toast(n?("Calendar read. "+n+(n===1?" block":" blocks")+" taken."):"Calendar read. Nothing booked.");
  });
}
function renderGcalCard(){

    c.innerHTML='<div class="row"><div class="grow"><div class="t">Not set up</div>'+

  }

  c.innerHTML='<div class="row tap" data-gcal="1"><div class="plus">↻</div>'+
    '<div class="grow"><div class="t">'+(p&&p.gcal?"Read again":"Read my busy times")+"</div>"+
    '<div class="s">'+(p&&p.gcal?(n+(n===1?" hour":" hours")+" taken this week")
      :"Google Calendar, free/busy only. Never the titles.")+"</div></div></div>";
}

/* ═══════════════ the four steps ═══════════════
   1 name it · 2 get the link · 3 wait for them · 4 put it in the calendar.
   A step is done when the thing it asks for exists, and the one you are on
   is the first that is not. The rail says which, and the button does it. */
function stepDone(n){
  if(n===1) return !!S.title.trim();
  if(n===2) return inMeeting();
  if(n===3) return guests().length>1;
  if(n===4) return !!(MEET&&MEET.startsAt);
  return false;
}
function stepNow(){
  for(var n=1;n<=4;n++) if(!stepDone(n)) return n;
  return 4;
}
function renderSteps(){
  var now=stepNow(), n, el;
  for(n=1;n<=3;n++){
    el=$("#s"+n);
    if(!el) continue;
    el.textContent=stepDone(n)?"✓":n;
    el.className="stepn"+(stepDone(n)?" done":(n===now?" on":" wait"));
  }
  el=$("#dockStep");
  if(el) el.className="stepn"+(now===4?" on":" wait");
}

/* One button, and what it says is where you are.
     no meeting  → make one
     no hour yet → say what is missing
     an hour     → put it in the calendar, for everyone at once */
function renderDock(){
  var b=$("#primary"), h=$("#dockHint"), tz=dispTz(), t=sel(), total=guests().length;
  $("#hoursBtn").style.display=ready()?"":"none";
  $("#icsBtn").style.display=(t?"":"none");

  if(LIVE && !signedIn()){
    b.textContent="Sign in with Google"; b.disabled=false;
    h.textContent="Overlap needs to know who you are before it can hold a link.";
    return;
  }
  if(LIVE && !ready()){
    b.textContent="Save my hours"; b.disabled=false;
    h.textContent="One answer, reused by every meeting after this.";
    return;
  }
  if(LIVE && !inMeeting()){
    b.textContent="Get the link"; b.disabled=false;
    h.textContent=S.title.trim()
      ? "Makes the link you send round."
      : "Name it first. That is what everyone else will see.";
    return;
  }
  b.textContent=MEET&&MEET.startsAt?"Open in Google Calendar":"Add to Google Calendar";
  b.disabled=!t;
  if(total<2){
    /* an hour that works for one person is not news. Say what is missing,
       but leave the button alive: a solo hold is nobody else's business. */
    h.textContent="Waiting for them. Send the link, or invite someone you have met.";
    return;
  }
  if(!t){
    h.textContent="No hour works yet. Widen someone’s hours, or look at next week.";
    return;
  }
  var n=countFor(t,S.dur);
  h.textContent=fmtLongDate(t,tz)+", "+fmtT(t,tz)+" · "+fmtDur(S.dur)+" · "+
    (n===total?"everyone free":n+" of "+total+" free");
}

/* ═══════════════ the sheet ═══════════════ */
/* The sheet only ever edits you. There is nobody else to edit — everyone
   answers for themselves through the link. */
var draft=null, draftSetup=false;
function openSheet(setup){
  var p=meRow();
  if(!p) return;
  draftSetup=!!setup;
  draft={id:p.id,tz:p.tz,s:p.s,e:p.e,wknd:p.wknd,
         sl:p.sl==null?23:p.sl,sw:p.sw==null?7:p.sw};
  $("#sheetTitle").textContent=setup?"Your day":"My hours";
  $("#sheetCancel").style.visibility=setup?"hidden":"";
  $("#sheetDone").textContent=setup?"Save":"Done";
  $("#sheetLede").textContent=setup
    ? "Answer this once. Every meeting after this one starts with it already filled in."
    : "Yours alone. Everyone else answers for themselves through the link.";
  $("#citySearch").value="";
  renderDraft(); renderCities("");
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  document.body.style.overflow="hidden";
}
function closeSheet(){
  if(draftSetup) return;                 /* the one sheet you cannot walk past */
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  document.body.style.overflow=""; draft=null;
}
function commitDraft(){
  if(!draft) return;
  var p=byId(draft.id);
  if(!p){ draftSetup=false; closeSheet(); return; }
  p.tz=draft.tz; p.s=draft.s; p.e=draft.e; p.wknd=draft.wknd;
  p.sl=draft.sl; p.sw=draft.sw;
  var wasSetup=draftSetup;
  draftSetup=false;
  closeSheet();
  if(!LIVE){ afterChange(); return; }
  saveProfile(p).then(function(){ return syncPerson(p); })
    .then(function(){ afterChange(); if(wasSetup) haptic(); })
    .catch(function(e){ toast(e.message); afterChange(); });
}
function renderDraft(){
  $("#fStart").textContent=fmtHour(draft.s);
  $("#fEnd").textContent=fmtHour(draft.e);
  $("#fSleep").textContent=fmtHour(draft.sl);
  $("#fWake").textContent=fmtHour(draft.sw);
  renderGcalCard();
  $("#fWeekend").classList.toggle("on",draft.wknd);
  var all=$("#cityList").querySelectorAll("[data-tzsel]"), i;
  for(i=0;i<all.length;i++) all[i].querySelector(".mark").style.opacity=
    (all[i].getAttribute("data-tzsel")===draft.tz?"1":"0");
}
function renderCities(q){
  q=(q||"").toLowerCase().trim();
  var now=Date.now(), list=CITIES.filter(function(c){
    return !q || c[0].toLowerCase().indexOf(q)>=0 || c[1].toLowerCase().indexOf(q)>=0 ||
           c[2].toLowerCase().indexOf(q)>=0;
  });
  if(draft && !list.some(function(c){ return c[2]===draft.tz; }))
    list.unshift([tzCity(draft.tz),"Your timezone",draft.tz]);
  if(!list.length){ $("#cityList").innerHTML='<div class="empty">Nothing matches “'+esc(q)+'”.</div>'; return; }
  $("#cityList").innerHTML=list.slice(0,60).map(function(c){
    return '<div class="row tap" data-tzsel="'+esc(c[2])+'">'+
      '<div class="grow"><div class="t">'+esc(c[0])+'</div>'+
      '<div class="s">'+esc(c[1])+" · "+tzLabel(c[2],now)+"</div></div>"+
      '<div class="v" style="font-size:15px">'+fmtT(now,c[2])+"</div>"+
      '<span class="mark" style="width:16px;text-align:center;font-weight:700;opacity:0">✓</span></div>';
  }).join("");
  if(draft) renderDraft();
}
/* ═══════════════ exports ═══════════════ */
function meetingTitle(){ return S.title.trim() || "Meeting"; }
function icsStamp(ts){
  var d=new Date(ts);
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+
         pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z";
}
function localLines(){
  var t=sel(), tz=dispTz(), base=dayKey(t,tz);
  return guests().map(function(p){
    var k=dayKey(t,p.tz), d=k>base?" (+1d)":(k<base?" (−1d)":"");
    return pname(p)+": "+fmtT(t,p.tz)+d+"  ·  "+tzCity(p.tz);
  });
}
function inviteText(){
  var t=sel(), tz=dispTz();
  return meetingTitle()+"\n"+fmtLongDate(t,tz)+" · "+fmtDur(S.dur)+"\n\n"+localLines().join("\n");
}
function gcalUrl(){
  var t=sel(), end=t+S.dur*60000;
  var emails=guests().filter(function(p){ return p.email; }).map(function(p){ return p.email; });
  var u="https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(meetingTitle())+
    "&dates="+icsStamp(t)+"/"+icsStamp(end)+
    "&details="+encodeURIComponent(localLines().join("\n")+"\n\nPlanned with Overlap");
  if(emails.length) u+="&add="+encodeURIComponent(emails.join(","));
  return u;
}
function icsText(){
  var t=sel(), end=t+S.dur*60000;
  function e(s){ return String(s).replace(/[\;,]/g,"\\$&").replace(/\n/g,"\\n"); }
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//overlap//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:"+t+"-overlap","DTSTAMP:"+icsStamp(Date.now()),
    "DTSTART:"+icsStamp(t),"DTEND:"+icsStamp(end),
    "SUMMARY:"+e(meetingTitle()),"DESCRIPTION:"+e(localLines().join("\n"))]
    .concat(guests().filter(function(p){ return p.email; }).map(function(p){
      return "ATTENDEE;CN="+e(pname(p))+":mailto:"+p.email; }))
    .concat(["END:VEVENT","END:VCALENDAR"]).join("\r\n");
}
function copyText(s,msg){
  function fallback(){
    var a=document.createElement("textarea");
    a.value=s; a.style.position="fixed"; a.style.opacity="0";
    document.body.appendChild(a); a.select();
    try{ document.execCommand("copy"); toast(msg); }catch(e){ toast("Copy failed"); }
    document.body.removeChild(a);
  }
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(s).then(function(){ toast(msg); },fallback);
  else fallback();
}

/* ═══════════════ change plumbing ═══════════════ */
function afterChange(){
  _auto=null;
  if(S.pick!==null){
    var days=dayStarts(), lo=days[0], hi=days[DAYS-1]+86400000;
    if(S.pick<lo||S.pick>=hi) S.pick=null;
  }
  if(S.pick!==null){ var di=dayIndex(S.pick); if(di>=0) S.day=di; }
  save(); renderAll();
}

/* ═══════════════ events ═══════════════ */
document.addEventListener("click",function(ev){
  var el, t=ev.target;
  function up(attr){ return t.closest?t.closest("["+attr+"]"):null; }

  if((el=up("data-guest"))){
    var gid=el.getAttribute("data-guest"), at=S.nogo.indexOf(gid);
    if(at>=0) S.nogo.splice(at,1); else S.nogo.push(gid);
    afterChange(); haptic(); return;
  }
  if((el=up("data-fold"))){
    var sec=$("#"+el.getAttribute("data-fold"));
    sec.classList.toggle("open"); renderPeople(); haptic(); return;
  }
  if((el=up("data-dur"))){
    var d=el.getAttribute("data-dur")==="+"?DUR_STEP:-DUR_STEP;
    S.dur=Math.max(DUR_MIN,Math.min(DUR_MAX,S.dur+d));
    afterChange(); renameMeeting(); haptic(); return;
  }
  if((el=up("data-pick"))){
    S.pick=+el.getAttribute("data-pick");
    var di=dayIndex(S.pick); if(di>=0) S.day=di;
    renderDock(); save(); haptic();
    renderDays(); renderWTB();
    return;
  }
  if((el=up("data-share"))){ openShare(); return; }
  if((el=up("data-meetings"))){ openMeetings(); return; }
  if((el=up("data-peeps"))){ openPeep(); return; }
  if((el=up("data-peep"))){ inviteContact(el.getAttribute("data-peep")); return; }
  if((el=up("data-hours"))){ openSheet(false); return; }
  if((el=up("data-gcal"))){
    var who=meRow();
    if(!who) return;
    toast("Asking Google…");
    syncCalendar(who).then(function(){ renderGcalCard(); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if((el=up("data-pickmeet"))){ switchMeeting(el.getAttribute("data-pickmeet")); closeMeetings(); return; }
  if((el=up("data-newmeet"))){
    closeMeetings();
    S.mid=""; S.pick=null; S.title=""; save();
    refreshMe().then(function(){ afterChange(); $("#titleInput").focus(); });
    return;
  }
  if((el=up("data-leavemeet"))){
    if(!confirm("Leave “"+(S.title.trim()||"this meeting")+"”?")) return;
    var gone=S.mid;
    closeMeetings();
    cx("meet.leave",{token:token(),meetingId:gone}).then(function(){
      S.mid=""; S.pick=null; save(); return refreshMe();
    }).then(function(){ afterChange(); toast("Left"); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if((el=up("data-signout"))){
    var tk=token();
    setToken(""); ME=null; MEET=null;
    try{ localStorage.removeItem(KEY); }catch(e){}
    if(LIVE) location.replace(basePath()+"/login/");
    if(LIVE&&tk) cx("auth.signOut",{token:tk}).catch(function(){});
    return;
  }
  if((el=up("data-want"))){
    var w=el.getAttribute("data-want"), at2=S.wants.indexOf(w);
    if(at2>=0) S.wants.splice(at2,1); else S.wants.push(w);
    renderFeedback(); haptic(); return;
  }
  if((el=up("data-day"))){
    S.day=+el.getAttribute("data-day"); renderDays(); renderWTB(); haptic(); return;
  }
  if((el=up("data-tzsel"))){
    draft.tz=el.getAttribute("data-tzsel"); renderDraft(); haptic(); return;
  }
  if((el=up("data-h"))){
    var k=el.getAttribute("data-h");
    if(k==="s-") draft.s=Math.max(0,draft.s-1);
    if(k==="s+") draft.s=Math.min(draft.e-1,draft.s+1);
    if(k==="e-") draft.e=Math.max(draft.s+1,draft.e-1);
    if(k==="e+") draft.e=Math.min(24,draft.e+1);
    if(k==="z-") draft.sl=(draft.sl+23)%24;
    if(k==="z+") draft.sl=(draft.sl+1)%24;
    if(k==="w-") draft.sw=(draft.sw+23)%24;
    if(k==="w+") draft.sw=(draft.sw+1)%24;
    renderDraft(); return;
  }
});

/* ── strip: tap a column to take that hour, drag a row to change someone's ── */
var painting=null, editing=false;
function hcAt(x,y){
  var el=document.elementFromPoint(x,y);
  return (el&&el.classList&&el.classList.contains("hc"))?el:null;
}
function applyPaint(el){
  if(!painting) return;
  var p=byId(painting.id); if(!p) return;
  if(el.getAttribute("data-p")!==p.id) return;
  var ts=+el.getAttribute("data-ts"), k=""+ts;
  if(isFree(p,ts)===painting.val) return;
  delete p.ov[k];
  if(isFree(p,ts)!==painting.val) p.ov[k]=painting.val;
  var st=pstate(p,ts);
  el.classList.toggle("busy",st==="sleep");
  el.classList.toggle("off",st==="off");
  edgeRow(p.id);
  refreshSum(+el.getAttribute("data-col"),ts);
}
/* bars run across neighbouring hours, so the rounded ends have to move when
   an hour in the middle changes. Twenty-four cells — cheap enough to redo. */
function cellState(el){
  return el.classList.contains("busy")?"sleep":(el.classList.contains("off")?"off":"free");
}
function edgeRow(pid){
  var cells=$("#wtb").querySelectorAll('.hc[data-p="'+pid+'"]'), i, st, next, prev=null;
  for(i=0;i<cells.length;i++){
    st=cellState(cells[i]);
    next=(i+1<cells.length)?cellState(cells[i+1]):null;
    cells[i].classList.toggle("s",st!==prev);
    cells[i].classList.toggle("e",st!==next);
    prev=st;
  }
}
function takeSlot(ts){
  S.pick=ts; save(); markColumn(); renderDock(); haptic();
}
/* pointerdown paints (edit mode only) — picking waits for a real click, so a
   sideways swipe scrolls the strip instead of booking an hour */
$("#wtb").addEventListener("pointerdown",function(ev){
  if(!editing) return;
  var el=ev.target.closest?ev.target.closest(".hc"):null;
  if(!el) return;
  var pid=el.getAttribute("data-p");
  if(!pid) return;
  var me=meRow();                         /* only ever your own row */
  if(!me || pid!==me.id) return;
  painting={id:pid,val:!isFree(byId(pid),+el.getAttribute("data-ts"))};
  ev.preventDefault();
  if(this.setPointerCapture) this.setPointerCapture(ev.pointerId);
  applyPaint(el); haptic();
});
$("#wtb").addEventListener("click",function(ev){
  if(editing) return;
  var el=ev.target.closest?ev.target.closest(".hc"):null;
  if(!el) return;
  if(el.classList.contains("past")) return toast("That hour has gone");
  takeSlot(+el.getAttribute("data-ts"));
});
$("#wtb").addEventListener("pointermove",function(ev){
  if(!painting) return;
  var el=hcAt(ev.clientX,ev.clientY);
  if(el) applyPaint(el);
});
window.addEventListener("pointerup",function(){
  if(!painting) return;
  var who=byId(painting.id);
  painting=null; _auto=null;
  save(); renderDock();
  if(who) syncPerson(who);
});
$("#editToggle").addEventListener("click",function(){
  editing=!editing; renderWTB(); haptic();
  $("#editToggle").textContent=editing?"Done":"Edit hours";
  toast(editing?"Drag along your own row to cross out hours":"");
});

/* ═══════════════ boot ═══════════════
   Signed in or nowhere. The only thing a signed-out browser can do is
   follow a link to the login page and come back — which is what makes a
   share link worth sending: whoever opens it lands in the same meeting.

   Without a backend configured there is nothing to sign in to, so the app
   runs against this browser alone. That is the workbench, not the product.
   ═══════════════════════════════════════ */
var joinCode=(location.hash.match(/^#j=([A-Za-z0-9_-]+)/)||[])[1]||"";
if(joinCode) history.replaceState(null,"",location.pathname);

if(LIVE && !token()){
  location.replace(basePath()+"/login/?next="+
    encodeURIComponent(location.pathname+(joinCode?"#j="+joinCode:"")));
}

if(!load()) freshState();
if(sel()!==null){ var _d=dayIndex(sel()); if(_d>=0) S.day=_d; }
if(window.innerWidth>=900){
  $("#peopleSec").classList.add("open");
  $("#meetSec").classList.add("open");
}
renderAll();
if(isNextPage()) requestAnimationFrame(function(){ openFeedback(false); });

if(LIVE){
  refreshMe().then(function(){
    if(!ME && token()){        /* the session died while we were away */
      setToken("");
      location.replace(basePath()+"/login/?next="+encodeURIComponent(location.pathname));
      return null;
    }
    flushFeedback();
    if(!ME) return null;
    /* a share link: walk in, then carry on as if you had always been here */
    if(joinCode){
      var code=joinCode; joinCode="";
      return joinMeeting(code).then(function(){
        toast("You are in. " + (MEET?MEET.title:"the meeting"));
      },function(e){ toast(e.message); });
    }
    return null;
  }).then(function(){
    afterChange();
    /* The one thing everybody has to do once, asked at the only moment it
       makes sense: the first time they are actually here. */
    if(signedIn() && !ready()) openSheet(true);
  });
}
/* keep the clocks honest without a heartbeat the phone has to pay for */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden) renderPeople();
});
setInterval(function(){ if(!document.hidden) renderPeople(); },60000);

})();
