<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overlap — schedule meetings at hours that work for everyone</title>
<meta name="description" content="Schedule meetings at hours that work for everyone. One link, every timezone, your Google Calendar included. Free.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/overlap/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Overlap — schedule meetings at hours that work for everyone">
<meta property="og:description" content="One link, every timezone, your Google Calendar included. The hour that suits the whole group draws itself. Free.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=4">
<style>
/* ═══════════════════════════════════════════════════════════
   The landing page. Same tokens as the app, different furniture:
   wide measure, big type, product shown rather than described.
   ═══════════════════════════════════════════════════════════ */
html,body{background:var(--paper)}
body{font-size:16px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ── nav ── */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  transition:box-shadow .2s}
.top.stuck{box-shadow:0 1px 0 var(--sep)}
.top .wrap{display:flex;align-items:center;gap:8px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;letter-spacing:-.035em;
  text-decoration:none;color:var(--ink)}
.mark{width:26px;height:23px;flex:none;color:var(--ink);--mark-cut:var(--paper)}
.top nav{display:none;gap:4px;margin-left:14px;flex:1}
@media (min-width:760px){ .top nav{display:flex} }
.top nav a{font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--ink-2);
  text-decoration:none;padding:8px 12px;border-radius:9px}
.top nav a:hover{color:var(--ink);background:var(--fill)}
.top .sp{flex:1}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;
  border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  letter-spacing:-.015em;text-decoration:none;white-space:nowrap;
  transition:transform .14s var(--ease),opacity .14s}
.btn2:hover{opacity:.86}
.btn2:active{transform:scale(.97)}
.btn2.lg{height:52px;padding:0 26px;font-size:16px}
.btn2.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(60,60,67,.22)}
.btn2.line:hover{background:var(--fill);opacity:1}
.btn2.inv{background:var(--paper);color:var(--ink)}

/* ── hero ── */
.hero{padding:72px 0 0;text-align:center}
h1{font-size:clamp(40px,7vw,76px);line-height:1.02;letter-spacing:-.045em;font-weight:800;
  margin:0 0 22px;text-wrap:balance;position:relative;z-index:0}
h1 .hl{position:relative;white-space:nowrap;z-index:0}
h1 .hl::after{content:"";position:absolute;left:-4px;right:-4px;bottom:.34em;height:.26em;
  background:var(--fill-2);z-index:-1;border-radius:4px}
.lede{font-size:clamp(17px,2.1vw,20px);line-height:1.5;color:var(--ink-2);max-width:600px;
  margin:0 auto 32px;letter-spacing:-.015em;text-wrap:balance}
.herobtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── footer ── */
footer{padding:30px 0 40px;box-shadow:0 -1px 0 var(--sep);margin-top:80px}
.fbot{font-size:13px;color:var(--ink-3)}
.free{margin:20px 0 0;font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2)}
.fbot a{color:var(--ink-2)}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="/overlap/"><svg class="mark" viewBox="0 0 64 56" aria-hidden="true"><g fill="currentColor"><rect x="4" y="13" width="9" height="30" rx="4.5"/><rect x="18" y="4" width="9" height="48" rx="4.5"/><rect x="32" y="17" width="9" height="22" rx="4.5"/><rect x="46" y="9" width="9" height="38" rx="4.5"/></g><rect x="1" y="24" width="61" height="7" rx="3.5" fill="var(--mark-cut,#fff)"/></svg>Overlap</a>
    <span class="sp"></span>
    <a class="btn2" href="/overlap/team/">Open Overlap</a>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>Schedule meetings at hours that work for <span class="hl">everyone</span>.</h1>
    <p class="lede">One link. Everyone answers for themselves, their Google Calendar
      included, and the hour that suits the whole group draws itself.</p>
    <div class="herobtns">
      <a class="btn2 lg" href="/overlap/team/">Open Overlap</a>
    </div>
    <p class="free">Free.</p>
  </div>

  <footer>
    <div class="fbot">Built by <a href="/">Jeremy Lasne</a> ·
      <a href="https://github.com/jlasne/jeremyportfolio/tree/main/overlap">Source</a> ·
      Your hours, nothing more.</div>
  </footer>
</div>

<div class="toast" id="toast"></div>
<script>
addEventListener("scroll",function(){
  document.getElementById("top").classList.toggle("stuck",scrollY>4);
},{passive:true});
</script>
</body>
</html>
