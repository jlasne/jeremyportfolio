<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Overlap</title>
<meta name="description" content="Sign in to Overlap.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/overlap/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   Meet on time — iOS-light design system.
   One ink (black), one paper (white), one ground (#F2F2F7).
   Everything else is opacity.
   ───────────────────────────────────────────────────────────── */
:root{
  --wruler:26px; --wsum:34px; --wrow:40px; --cw:34px; --lab:102px;
  --paper:#FFFFFF;
  --ground:#F2F2F7;
  --ink:#000000;
  --ink-2:rgba(60,60,67,.60);
  --ink-3:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.29);
  --fill:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.20);
  --radius:14px;
  --dock-h:calc(72px + env(safe-area-inset-bottom));
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ground);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font);font-size:17px;line-height:1.35;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-optical-sizing:auto;font-synthesis-weight:none;
  overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input{border:0;background:none;outline:none;width:100%}
::selection{background:#000;color:#fff}

.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--ground)}
.nav-sub,.sechead.desk-only{display:none}

/* ── nav ── */
.nav{position:sticky;top:0;z-index:40;background:rgba(242,242,247,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.nav.scrolled{box-shadow:0 .5px 0 var(--sep)}
.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 10px;min-height:44px}
.nav-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.03em;
  color:var(--ink);text-decoration:none}
.nav-title .rail-mark{width:19px;height:17px;flex:none;--mark-cut:var(--ground)}
.nav-act{font-size:15px;color:var(--ink);opacity:.45}
.nav-act:active{opacity:.25}

/* ── the side ────────────────────────────────────────────────────
   Everything you set — who is in the team, what the meeting is, which
   team you are in. On a desk it is a column pinned to the left; on a
   phone there is no room for a column, so it folds up and sits above
   the schedule instead.
   ──────────────────────────────────────────────────────────────── */
.rail{padding:0 16px}
.rail-brand{display:none}
.rsec{margin:0 0 14px}
.rhead{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px 8px;text-align:left}
.rhead>span{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.rhead>b{flex:1;min-width:0;font-size:13px;font-weight:400;color:var(--ink-2);letter-spacing:-.005em;
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .fold{width:7px;height:7px;flex:none;border-right:2px solid var(--ink-3);
  border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .2s var(--ease)}
.rsec.open .rhead .fold{transform:rotate(-135deg) translate(-2px,-2px)}
.rsec .rbody{display:none}
.rsec.open .rbody{display:block}
.rsec .row input{text-align:right;flex:1;font-size:17px;letter-spacing:-.02em}
.rail-foot{padding:4px 16px 0;display:flex;flex-direction:column;gap:2px}

/* ── layout ── */
main{flex:1;padding:6px 0 8px}
.step{display:none;animation:fade .3s var(--ease)}
.step.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{padding:0 16px;margin:0 0 30px}

/* ── a section of the page you read ── */
.pane{padding:0 16px;margin:0 0 34px;scroll-margin-top:64px}
.panehead{display:flex;align-items:baseline;gap:10px;padding:0 4px 12px}
.panehead h2{font-size:21px;line-height:1.15;font-weight:700;letter-spacing:-.03em;margin:0}
.panehead .ph-note{flex:1;min-width:0;font-size:13px;color:var(--ink-2);letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panehead .linkbtn{flex:none}
@media (max-width:520px){ .panehead{flex-wrap:wrap;row-gap:2px}
  .panehead .ph-note{order:3;flex-basis:100%} }
.sechead{font-size:13px;color:var(--ink-2);letter-spacing:-.005em;padding:0 4px 10px;display:flex;justify-content:space-between;align-items:flex-end}
.sechead b{font-weight:400}
.sechead.gap{padding-top:28px}
.secfoot{font-size:13px;line-height:1.45;color:var(--ink-2);padding:10px 4px 0}
.card{background:var(--paper);border-radius:var(--radius);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:13px;padding:13px 16px;min-height:58px}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.row.tap{cursor:pointer;transition:background .12s}
.row.tap:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink-2);letter-spacing:-.005em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:17px;color:var(--ink-2);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chev{width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);flex:none;margin-left:2px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600;letter-spacing:0;flex:none}
.avatar.you{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.plus{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none;font-size:20px;font-weight:300;color:var(--ink);line-height:1}
.del{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--ink-2);display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.del:active{background:var(--fill-2)}

/* ── buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.02em;transition:transform .12s var(--ease),opacity .12s}
.btn:active{transform:scale(.975);opacity:.85}
.btn[disabled]{opacity:.25;transform:none}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);height:44px;font-weight:400}
.btnrow{display:flex;gap:10px}
.chips{display:flex;gap:9px;flex-wrap:wrap;padding:2px 4px 0}
.chip{padding:8px 15px;border-radius:999px;background:var(--paper);font-size:14px;font-weight:500;letter-spacing:-.01em;box-shadow:inset 0 0 0 1px var(--sep)}
.chip:active{background:var(--fill)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
#durChips .chip{padding:8px 11px;font-size:13px;font-variant-numeric:tabular-nums}

/* ── dock ── */
.dock{position:sticky;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(242,242,247,.86);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 -.5px 0 var(--sep)}
.dock-hint{font-size:12px;color:var(--ink-2);text-align:center;padding-bottom:8px;letter-spacing:-.005em}

/* ── the day being looked at ── */
.weekbar{display:flex;align-items:stretch;gap:8px;padding-bottom:10px}
.weekbar .daytabs{flex:1;min-width:0;padding-bottom:0}
.wsteps{display:flex;flex:none;background:var(--fill);border-radius:9px;overflow:hidden}
.wsteps button{width:32px;display:grid;place-items:center;font-size:17px;color:var(--ink)}
.wsteps button:active{background:var(--fill-2)}
.wsteps button+button{box-shadow:inset 1px 0 0 var(--sep)}
.weeksub{font-size:12px;color:var(--ink-2);letter-spacing:-.005em;padding:0 4px 10px}
.daytabs{display:flex;gap:5px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.dtab{flex:none;min-width:46px;padding:5px 9px 6px;border-radius:9px;background:var(--fill);text-align:center;transition:background .15s}
.dtab .wd{display:block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.dtab .dd{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;margin-top:0;font-variant-numeric:tabular-nums}
.dtab.we{opacity:.5}
.dtab.on{background:var(--ink);color:#fff;opacity:1}
.dtab.on .wd{color:rgba(255,255,255,.55)}
.dtab.past{color:var(--ink-3);
  background-image:repeating-linear-gradient(135deg,rgba(60,60,67,.16) 0 2px,transparent 2px 6px)}
.dtab.past .wd{color:var(--ink-3)}
/* ── the schedule ───────────────────────────────────────────────
   Names down the side, the day across the top, one column per hour.
   A column is one instant: the ruler reads it on the reader's clock,
   and every row reads the same instant on a different one. Bars, not
   a chequerboard — contiguous hours join up, the way a calendar draws
   a meeting.
   ─────────────────────────────────────────────────────────────── */
.wtb{display:flex;background:var(--paper);border-radius:var(--radius);overflow:hidden}
.wtblabs{flex:none;width:var(--lab);display:grid;box-shadow:1px 0 0 var(--sep);z-index:3;background:var(--paper)}
.wtbscroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wtbscroll::-webkit-scrollbar{display:none}
.wtbgrid{display:grid;position:relative;min-width:100%}
.wtbgrid.edit{touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}

/* the name column */
.rlab{display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 15px;overflow:hidden}
.rlab b{font-size:14px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlab span{display:flex;align-items:baseline;gap:5px;font-size:11px;color:var(--ink-2);margin-top:1px}
.rlab span em{font-style:normal;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlab span i{font-style:normal;flex:none;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rlab+.rlab{box-shadow:inset 0 -1px 0 rgba(60,60,67,.10)}
.rlab.sum{box-shadow:0 1px 0 var(--sep)}
.rlab.head{justify-content:flex-end;padding-bottom:5px}
.rlab.head b{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.rlab.sum b{font-weight:700}

/* the hour ruler */
.tick{display:flex;align-items:flex-end;padding:0 0 5px 4px;font-size:10px;font-weight:600;
  letter-spacing:.01em;color:var(--ink-3);font-variant-numeric:tabular-nums;
  box-shadow:inset 1px 0 0 rgba(60,60,67,.08)}
.tick.q{box-shadow:inset 1px 0 0 rgba(60,60,67,.20)}
.tick.on{color:var(--ink);font-weight:700}

/* one hour, one person */
.hc{position:relative;display:flex;align-items:center;justify-content:center;
  --gl:rgba(60,60,67,.09); --rl:rgba(60,60,67,.10);
  box-shadow:inset 1px 0 0 var(--gl),inset 0 -1px 0 var(--rl)}
.hc.busy,.hc.off{--gl:transparent}
.hc.busy{--rl:rgba(255,255,255,.14)}
.hc.date{box-shadow:inset 1.5px 0 0 var(--ink-3),inset 0 -1px 0 var(--rl);
  justify-content:flex-start;padding-left:4px}
/* the bar itself, inset so a row reads as a track with something laid in it */
.hc.busy::before,.hc.off::before{content:"";position:absolute;left:0;right:0;top:4px;bottom:4px}
.hc.busy::before{background:var(--ink)}
.hc.off::before{background:repeating-linear-gradient(135deg,
  rgba(0,0,0,.24) 0 2px,rgba(0,0,0,.07) 2px 6px)}
.hc.s::before{border-top-left-radius:7px;border-bottom-left-radius:7px;left:1px}
.hc.e::before{border-top-right-radius:7px;border-bottom-right-radius:7px;right:1px}
.hc .n,.hc .dm{position:relative;z-index:1}
.hc .n{font-size:11px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hc .dm{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.hc.busy .n{color:#fff}
.hc.busy .dm{color:rgba(255,255,255,.55)}

/* the team band: paper when everyone can, ink when nobody, and the
   shades between are how many are out */
.hc.sum{background:rgba(0,0,0,var(--k,0));
  box-shadow:inset 1px 0 0 rgba(60,60,67,.09),inset 0 -1px 0 var(--sep)}
.hc.sum.none{background:var(--ink)}
.hc.sum.all::after{content:"";position:absolute;left:2px;right:2px;bottom:3px;height:3px;
  border-radius:2px;background:var(--ink)}
.hc.sum .n{background:var(--paper);color:var(--ink);border-radius:4px;padding:1px 4px;
  font-size:10px;box-shadow:0 1px 2px rgba(0,0,0,.18)}

/* now, and everything before it — struck through rather than painted over,
   so what was underneath still reads */
.pastwash{position:absolute;top:var(--wruler);bottom:0;left:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(135deg,
    rgba(242,242,247,.92) 0 2px,rgba(242,242,247,.22) 2px 6px)}
.nowline{position:absolute;top:var(--wruler);bottom:0;width:1.5px;margin-left:-.75px;
  background:var(--ink);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-3px;left:-2.25px;width:6px;height:6px;
  border-radius:50%;background:var(--ink)}
.colmark{position:absolute;top:0;bottom:0;border:2.5px solid var(--ink);border-radius:10px;
  pointer-events:none;z-index:5;box-shadow:0 0 0 2px var(--paper)}

/* ── who is coming ── */
.row.gst .avatar{opacity:.35;transition:opacity .14s}
.row.gst.on .avatar{opacity:1}
.row.gst .t,.row.gst .s{color:var(--ink-3)}
.row.gst.on .t{color:var(--ink)}
.row.gst.on .s{color:var(--ink-2)}
.row.gst .tick{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--ink-3);transition:background .14s,box-shadow .14s}
.row.gst.on .tick{background:var(--ink);box-shadow:none}
.row.gst.on .tick::after{content:"";width:9px;height:5px;border-left:2px solid #fff;
  border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
/* a row that is not coming stays on the calendar, greyed, so you can see it */
.rlab.notin{opacity:.4}
.hc.notin{opacity:.35}

.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;row-gap:5px;font-size:11px;
  color:var(--ink-2);padding:11px 4px 0;letter-spacing:-.005em}
.legend span{white-space:nowrap}
.legend .sp{flex:1 0 10px}
.legend .lg{width:12px;height:12px;border-radius:3px;display:block;flex:none}
.legend .lg.free{background:var(--paper);box-shadow:inset 0 0 0 1px var(--sep)}
.legend .lg.part{background:repeating-linear-gradient(135deg,
  rgba(0,0,0,.24) 0 2px,rgba(0,0,0,.07) 2px 6px);box-shadow:inset 0 0 0 1px var(--sep)}
.legend .lg.busy{background:var(--ink)}
/* a desk has the width for a wider hour and a longer name */
@media (min-width:600px){ :root{--cw:38px; --lab:124px} }
@media (min-width:900px){ :root{--cw:44px; --lab:152px} }
.linkbtn{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:-.01em;padding:0 2px}
.linkbtn:active{opacity:.4}
.linkbtn.on{color:var(--ink);font-weight:600}

/* ── account, invite, feedback ── */
.caret{width:6px;height:6px;border-right:1.8px solid var(--ink-3);border-bottom:1.8px solid var(--ink-3);
  transform:rotate(45deg) translate(-1px,-1px);flex:none}
.row .mark{font-weight:700;font-size:15px}
.linkbox{padding:14px 16px;font-size:13px;line-height:1.5;word-break:break-all;color:var(--ink-2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sheet-lede{font-size:14px;line-height:1.5;color:var(--ink-2);padding:0 20px 16px;letter-spacing:-.005em}
#fbText{width:100%;border:0;background:none;outline:none;padding:15px 16px;font-size:17px;
  letter-spacing:-.02em;line-height:1.45;resize:vertical;min-height:110px;font-family:var(--font)}
#fbText::placeholder{color:var(--ink-3)}
textarea{font-family:var(--font)}

/* ── slot cards ── */
.slot{display:flex;align-items:center;gap:14px;padding:15px 16px;position:relative;width:100%;text-align:left}
.slot+.slot::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.slot:active{background:var(--fill)}
.slot .radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3);flex:none;display:grid;place-items:center;transition:box-shadow .15s}
.slot.on .radio{background:var(--ink);box-shadow:none}
.slot.on .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.slot .when{flex:1;min-width:0}
.slot .when,.slot .w1,.slot .w2{display:block}
.slot .w1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.slot .w2{font-size:13px;color:var(--ink-2);margin-top:3px;letter-spacing:-.005em;line-height:1.5}
.slot .w1s{font-weight:400;color:var(--ink-2);font-size:15px}
.slot .lt b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.slot .lt .nd{font-style:normal;font-size:10px;font-weight:700;vertical-align:.35em;
  margin-left:1px;color:var(--ink-2)}
.slot .lt.out{opacity:.5}
.slot .lt.out b{color:var(--ink-2);font-weight:500}
.slot .sep{font-style:normal;opacity:.3;margin:0 5px}
.badge{font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 8px;border-radius:6px;background:var(--fill);color:var(--ink-2);white-space:nowrap}
.badge.all{background:var(--ink);color:#fff}
.empty{text-align:center;padding:40px 24px;color:var(--ink-2);font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:50;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--ground);border-radius:14px 14px 0 0;max-height:90dvh;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .42s var(--ease);max-width:520px;margin:0 auto}
@media (min-width:900px){ .sheet{max-width:720px} }
.sheet.on{transform:none;pointer-events:auto}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:6px auto 2px;flex:none}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;flex:none}
.sheet-nav .t{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheet-nav button{font-size:17px;letter-spacing:-.01em}
.sheet-nav button.p{font-weight:600}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(20px + env(safe-area-inset-bottom))}
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;padding:8px 10px;margin:0 16px 14px}
.search svg{flex:none;opacity:.42}
.search input{font-size:17px;letter-spacing:-.02em}
.search input::placeholder{color:var(--ink-2)}
.field{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;position:relative}
.field+.field::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.field label{width:76px;flex:none;font-size:17px;letter-spacing:-.02em}
.field input{font-size:17px;letter-spacing:-.02em}
.stepper{display:flex;background:var(--fill);border-radius:8px;overflow:hidden}
.stepper button{width:38px;height:32px;display:grid;place-items:center;font-size:18px;line-height:1}
.stepper button:active{background:var(--fill-2)}
.stepper span{width:1px;background:var(--sep)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill-2);position:relative;transition:background .25s var(--ease);flex:none}
.switch.on{background:var(--ink)}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .28s var(--ease)}
.switch.on i{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:rgba(0,0,0,.92);color:#fff;font-size:14px;font-weight:500;letter-spacing:-.01em;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:60;backdrop-filter:blur(10px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--ink-3);padding:10px 24px 28px;line-height:1.6}
.foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--ink-3)}
/* ── a wider phone, a tablet ── */
@media (min-width:820px){
  .app{max-width:760px}
  .nav-sub{display:inline;flex:1;font-size:13px;color:var(--ink-2);letter-spacing:-.005em}
  .dock{padding:12px 16px 16px}
  .dock .btn{max-width:420px;margin:0 auto}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:440px;max-width:440px;margin:0;
         border-radius:16px;max-height:84vh;opacity:0;
         transform:translate(-50%,-48%) scale(.97);
         transition:transform .3s var(--ease),opacity .22s ease}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .grab{display:none}
  .sheet-nav{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ═══════════════════════════════════════════════════════════
   The desk. The controls lift out of the page and become a
   column down the left; what is left in the middle is only the
   things you read — the schedule, the hours, the question.
   ═══════════════════════════════════════════════════════════ */
@media (min-width:900px){
  .rail{position:fixed;left:0;top:0;bottom:96px;width:288px;z-index:45;overflow-y:auto;
    padding:22px 16px 20px;background:var(--paper);box-shadow:1px 0 0 var(--sep);
    scrollbar-width:thin}
  .rail-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;
    letter-spacing:-.035em;color:var(--ink);text-decoration:none;padding:0 8px 22px}
  .rail-mark{width:26px;height:23px;flex:none;color:var(--ink);--mark-cut:var(--paper)}
  .rsec{margin:0 0 20px}
  .rhead{padding:0 4px 9px;cursor:default}
  .rhead .fold{display:none}
  .rsec .rbody{display:block}          /* a column has the room; nothing folds */
  .rsec .card{background:var(--ground)}
  /* a column is narrower than a page, so the rows go quieter to fit it */
  .rsec .row{min-height:46px;padding:8px 12px;gap:10px}
  .rsec .row+.row::before{left:12px}
  .rsec .row .t{font-size:15px}
  .rsec .row .s{font-size:12px}
  .rsec .row input{font-size:15px}
  .rsec .avatar,.rsec .plus{width:28px;height:28px;font-size:11px}
  .rsec .del{width:22px;height:22px;font-size:13px}
  /* four chips and a label do not both fit a column, so they stop sharing a line */
  .rsec .row.stack{flex-direction:column;align-items:stretch;gap:7px}
  .rsec .row.stack .grow{flex:none}
  .rsec .chips{gap:6px}
  .rsec #durChips{justify-content:flex-start}
  .rsec .chip{padding:6px 12px;font-size:13px;background:var(--paper)}
  .rsec .chip.on{background:var(--ink);color:#fff}
  .rsec .stepper button{width:32px;height:28px;font-size:16px}
  .rsec .secfoot{font-size:12px;padding-top:8px}

  .rail-foot{position:fixed;left:0;bottom:0;width:288px;z-index:46;
    padding:10px 16px 16px;background:var(--paper);
    box-shadow:1px 0 0 var(--sep),0 -1px 0 var(--sep)}
  .rail-team{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;width:100%;
    text-align:left;text-decoration:none;color:var(--ink);transition:background .14s}
  .rail-team:hover{background:var(--fill)}
  .rail-team .avatar,.rail-team .plus{width:28px;height:28px;font-size:11px}
  .rail-team .rail-tx{min-width:0;flex:1}
  .rail-team .rail-tx b{display:block;font-size:14px;font-weight:600;letter-spacing:-.02em}
  .rail-team .rail-tx span{display:block;font-size:12px;color:var(--ink-2);letter-spacing:-.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-team .caret{margin-left:auto}

  /* the page moves over and keeps only what it is for */
  .app{margin-left:288px;max-width:none;padding:0 36px}
  .nav{background:rgba(242,242,247,.86)}
  .nav-bar{padding:16px 0 12px}
  .nav-title{display:none}
  .dock{background:rgba(242,242,247,.88)}
  main,.dock,.foot{max-width:1000px;margin-left:auto;margin-right:auto;width:100%}
  .pane{padding:0;margin:0 0 42px}
  .panehead h2{font-size:26px}
  .panehead{padding-bottom:14px}
  /* a form is not improved by being a metre wide */
  #nextSec{max-width:660px}
}
@media (min-width:1280px){
  .app{padding:0 56px}
  main,.dock,.foot{max-width:1160px}
}

/* the phone keeps the controls in the flow: folded up, above the schedule,
   with the team and the account after everything else */
@media (max-width:899px){
  .app{display:flex;flex-direction:column}
  .nav{order:1} .rail{order:2} main{order:3} .dock{order:5}
  .rail-foot{order:4;margin-top:6px} .foot{order:6}
  .rail-foot .rail-team{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    text-decoration:none;color:var(--ink);background:var(--paper);padding:12px 16px;min-height:56px}
  .rail-foot .rail-team:first-child{border-radius:var(--radius) var(--radius) 0 0}
  .rail-foot .rail-team:last-child{border-radius:0 0 var(--radius) var(--radius)}
  .rail-foot .rail-team+.rail-team{box-shadow:inset 0 1px 0 var(--sep)}
  .rail-foot .rail-tx{flex:1;min-width:0}
  .rail-foot .rail-tx b{display:block;font-size:16px;font-weight:500;letter-spacing:-.02em}
  .rail-foot .rail-tx span{display:block;font-size:13px;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-foot .caret{margin-left:auto}
}

/* ── answering an invite: one screen, one question ── */
.respond-only,.respond-only.on{display:none}
body.responding .respond-only{display:block}
body.responding .rail,
body.responding .rail-foot,
body.responding #planSec,
body.responding #nextSec,
body.responding .nav-act{display:none}
body.responding .app{margin-left:0;padding:0}
body.responding #overlapSec{display:block;padding:0 16px}
body.responding #overlapSec .panehead{display:none}
body.responding #editToggle{display:none}
body.responding main,
body.responding .dock,
body.responding .foot{max-width:760px;margin-left:auto;margin-right:auto}

.door{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.door-in{width:100%;max-width:360px;text-align:center}
.door .mark{width:56px;height:49px;margin:0 auto 24px;display:block;color:var(--ink);
  --mark-cut:var(--ground)}
.door h1{font-size:27px;line-height:1.15;letter-spacing:-.035em;font-weight:700;margin:0 0 8px}
.door .lede{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0 0 28px;letter-spacing:-.01em}
#gbtn{display:flex;justify-content:center;min-height:44px}
.or{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-3);font-size:12px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--sep)}
.door .card{text-align:left;margin-bottom:12px}
.door input{font-size:16px;letter-spacing:-.02em}
.door input:disabled{color:var(--ink-2)}
.note{font-size:13px;line-height:1.5;color:var(--ink-2);margin:16px 0 0;letter-spacing:-.005em;
  min-height:20px}
.note.bad{color:var(--ink)}
.guest{margin:26px 0 0;padding-top:22px;box-shadow:0 -1px 0 var(--sep)}
.guest a{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--ink);
  text-decoration:none}
.guest a:hover{text-decoration:underline}
.guest span{display:block;font-size:13px;line-height:1.5;color:var(--ink-2);margin-top:5px;
  letter-spacing:-.005em}
.door .foot{margin-top:30px;font-size:13px;color:var(--ink-3)}
.door .foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--ink-3)}
</style>
</head>
<body>
<div class="door"><div class="door-in">
  <svg class="mark" viewBox="0 0 64 56" aria-hidden="true"><g fill="currentColor"><rect x="4" y="13" width="9" height="30" rx="4.5"/><rect x="18" y="4" width="9" height="48" rx="4.5"/><rect x="32" y="17" width="9" height="22" rx="4.5"/><rect x="46" y="9" width="9" height="38" rx="4.5"/></g><rect x="1" y="24" width="61" height="7" rx="3.5" fill="var(--mark-cut,#fff)"/></svg>
  <h1>Sign in to Overlap</h1>
  <p class="lede">Your teams and your hours, on every device you use.</p>
  <div id="ways">
    <div id="gwrap"><div id="gbtn"></div></div>
    <div class="or" id="or">or</div>
    <form id="loginForm">
      <div class="card">
        <div class="field"><label>Email</label>
          <input id="email" type="email" placeholder="you@company.com"
            autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="email"></div>
        <div class="field" id="codewrap" style="display:none"><label>Code</label>
          <input id="code" inputmode="numeric" maxlength="6" placeholder="6 digits"
            autocomplete="one-time-code"></div>
      </div>
      <button class="btn" id="go" type="submit">Continue</button>
    </form>
  </div>
  <p class="note" id="note"></p>
  <p class="guest" id="guestwrap"><a href="#" id="guest">Continue as guest</a>
    <span>Have a look round first — it all works, it just stays in this browser.</span></p>
  <p class="foot"><a href="/overlap/">Back to Overlap</a></p>
</div></div>
<script>
/* Connect the backend by pasting your Convex HTTP Actions URL here.
   It is the .convex.site host (not .convex.cloud) — `npx convex dev` prints it.

     window.OVERLAP_CONVEX_URL = "https://tidy-otter-123.convex.site";

   Left empty, Overlap runs entirely in the browser: no accounts, no shared
   teams, and feedback is queued locally until a backend appears. */
window.OVERLAP_CONVEX_URL = "https://amicable-chickadee-753.eu-west-1.convex.site";

/* Sign in with Google. Create an OAuth client at
   https://console.cloud.google.com/apis/credentials → Create credentials →
   OAuth client ID → Web application, add your site to Authorized JavaScript
   origins (https://jeremylasne.com and http://localhost:8000 for local work),
   then paste the client ID below AND set OVERLAP_GOOGLE_CLIENT_ID to the same
   value in the Convex dashboard.

   Left empty, the login page falls back to a six-digit code by email. */
window.OVERLAP_GOOGLE_CLIENT_ID = "";

</script>
<script>
/* ═══════════════════════════════════════════════════════════
   Overlap — the door.

   Google if a client ID is configured, a six-digit code by email
   otherwise. Either way it ends with a session token in local
   storage and a redirect to wherever you were headed.
   ═══════════════════════════════════════════════════════════ */
(function(){
"use strict";

var CONVEX=(window.OVERLAP_CONVEX_URL||"").replace(/\/+$/,"");
var LIVE=/^https?:\/\//.test(CONVEX);
var GID=window.OVERLAP_GOOGLE_CLIENT_ID||"";
var TOKKEY="overlap.token", GUESTKEY="overlap.guest";

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function base(){ return location.pathname.replace(/\/login\/?$/,"").replace(/\/$/,""); }
function nextUrl(){
  var m=location.search.match(/[?&]next=([^&]+)/);
  var n=m?decodeURIComponent(m[1]):"";
  return (/^\/[^/]/.test(n)?n:base()+"/team/");
}
function cx(op,args){
  var ctl=window.AbortController?new AbortController():null;
  var timer=setTimeout(function(){ if(ctl) ctl.abort(); },15000);
  return fetch(CONVEX+"/overlap",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({op:op,args:args||{}}),
    signal:ctl?ctl.signal:undefined
  }).then(function(r){ return r.json(); }).then(function(j){
    clearTimeout(timer);
    if(j&&j.ok) return j.value;
    throw new Error((j&&j.error)||"Something went wrong");
  },function(e){
    clearTimeout(timer);
    throw new Error(e&&e.name==="AbortError"?"The server did not answer":"Can’t reach the server");
  });
}
function say(msg,bad){
  var n=$("#note");
  n.textContent=msg||"";
  n.className="note"+(bad?" bad":"");
}
function land(r){
  try{
    localStorage.setItem(TOKKEY,r.token);
    localStorage.removeItem(GUESTKEY);     /* no longer a guest */
  }catch(e){}
  location.replace(nextUrl());
}
/* A look round without an account. Everything works, it just lives in this
   browser — no shared teams, nothing that follows you to another device. */
function asGuest(){
  try{ localStorage.setItem(GUESTKEY,"1"); }catch(e){}
  location.replace(nextUrl());
}

/* ── already signed in? straight through ── */
try{ if(LIVE && localStorage.getItem(TOKKEY)) location.replace(nextUrl()); }catch(e){}

if(!LIVE){
  $("#ways").innerHTML='<p class="note">No backend is connected yet, so there is '+
    'nothing to sign in to — Overlap still works without an account.</p>'+
    '<a class="btn" href="'+esc(base())+'/team/">Continue as guest</a>';
  $("#guestwrap").style.display="none";
} else {
  /* ── Google ── */
  if(GID){
    var sc=document.createElement("script");
    sc.src="https://accounts.google.com/gsi/client";
    sc.async=true; sc.defer=true;
    sc.onload=function(){
      try{
        google.accounts.id.initialize({
          client_id:GID,
          callback:function(resp){
            say("Signing you in…");
            cx("auth.google",{credential:resp.credential}).then(land)
              .catch(function(e){ say(e.message,true); });
          }
        });
        google.accounts.id.renderButton($("#gbtn"),
          {theme:"outline",size:"large",shape:"pill",text:"continue_with",width:320});
      }catch(e){ say("Google sign-in could not start",true); }
    };
    sc.onerror=function(){ say("Google sign-in could not load",true); };
    document.head.appendChild(sc);
  } else {
    $("#gwrap").style.display="none";
    $("#or").style.display="none";
  }

  /* ── email code ── */
  var stage=0, mail="";
  function step(){
    var btn=$("#go");
    if(stage===0){
      mail=$("#email").value.trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return say("That email looks off",true);
      btn.disabled=true; btn.textContent="…";
      cx("auth.requestCode",{email:mail}).then(function(r){
        stage=1; btn.disabled=false; btn.textContent="Sign in";
        $("#codewrap").style.display="";
        $("#email").disabled=true;
        say(r&&r.devCode?("Dev mode — your code is "+r.devCode)
                        :("A six-digit code is on its way to "+mail+"."));
        $("#code").focus();
      }).catch(function(e){ btn.disabled=false; btn.textContent="Continue"; say(e.message,true); });
      return;
    }
    var code=$("#code").value.trim();
    if(code.length<6) return say("Six digits",true);
    btn.disabled=true; btn.textContent="…";
    cx("auth.verify",{email:mail,code:code}).then(land)
      .catch(function(e){ btn.disabled=false; btn.textContent="Sign in"; say(e.message,true); });
  }
  $("#go").addEventListener("click",step);
  $("#loginForm").addEventListener("submit",function(ev){ ev.preventDefault(); step(); });
  $("#guest").addEventListener("click",function(ev){ ev.preventDefault(); asGuest(); });
}
})();

</script>
</body>
</html>
