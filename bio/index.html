<style>
/* ── tokens ─────────────────────────────────────────────────────────── */
:root {
  --ink: #050b16;
  --navy: #173d59;
  --blue: #5fa8d3;
  --ice: #eaf4fb;
  --ice-70: rgba(234, 244, 251, .72);
  --ice-45: rgba(234, 244, 251, .46);
  --line: rgba(95, 168, 211, .18);
  --card: linear-gradient(180deg, rgba(23, 61, 89, .42), rgba(23, 61, 89, .14));
  --display: 'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --pad: clamp(20px, 5vw, 56px);
  --w: 1080px;
}
* { box-sizing: border-box; }
html { background: var(--ink); color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: transparent; color: var(--ice);
  font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
}
body.editing { padding-bottom: 92px; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
::selection { background: var(--blue); color: var(--ink); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

.mono { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; }

/* ── the scene, behind the whole page ───────────────────────────────── */
.scene {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100lvh;
  z-index: -2; display: block; pointer-events: none;
}
.bg {
  position: fixed; top: -6%; left: -6%; width: 112%; height: 112%; z-index: -2; pointer-events: none;
  object-fit: cover; object-position: 50% 42%; filter: blur(16px) brightness(.45) saturate(.9); display: none;
}
.has-photo .bg { display: block; }
.has-photo .scene { display: none; }
.veil {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: rgba(5, 11, 22, .76); opacity: 0;
}
.scene .tw { animation: tw var(--t, 5s) ease-in-out var(--d, 0s) infinite; }
@keyframes tw { 50% { opacity: .1; } }

/* ── top bar ────────────────────────────────────────────────────────── */
.top {
  max-width: var(--w); margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
  padding: calc(var(--pad) * .6) var(--pad);
}
.brand { text-decoration: none; color: var(--ice-70); }
.brand:hover { color: var(--ice); }
.edit {
  background: rgba(5, 11, 22, .4); border: 1px solid var(--line); padding: 9px 12px 8px; cursor: pointer;
  color: var(--ice-70); transition: color .2s, border-color .2s;
}
.edit:hover { color: var(--ice); border-color: var(--blue); }
.editing .edit { visibility: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── sections ───────────────────────────────────────────────────────── */
main { max-width: var(--w); margin: 0 auto; padding: 0 var(--pad); }
section { padding: clamp(28px, 5vw, 64px) 0 0; }
section:last-child { padding-bottom: clamp(40px, 6vw, 80px); }
.head { margin-bottom: clamp(24px, 4vw, 40px); }
.head .n { color: var(--blue); display: block; margin-bottom: 14px; }
h2 {
  margin: 0; font: 400 clamp(46px, 7vw, 88px)/.95 var(--display); letter-spacing: .015em;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.tag { margin: 14px 0 0; max-width: 52ch; font-size: clamp(16px, 1.6vw, 18px); color: var(--ice-70); }
.sum { margin: 16px 0 0; color: var(--ice-70); line-height: 1.6; }

.pill {
  font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  padding: 7px 9px 6px; border: 1px solid var(--line); color: var(--ice-70); white-space: nowrap;
}

/* ── the log ────────────────────────────────────────────────────────── */
.log { border-top: 1px solid var(--line); background: rgba(5, 11, 22, .35); }
.lrow {
  display: grid; grid-template-columns: 124px repeat(var(--n), minmax(0, 1fr)) 64px;
  align-items: center; gap: 8px; padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--line);
  transition: opacity .3s;
}
.lrow.lhead { padding: 9px 10px 8px 12px; color: var(--ice-45); }
.lrow.lhead span { font: 500 10px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; text-align: center; }
.lrow.lhead .date { text-align: left; }
.lrow.lhead .s { text-align: right; }
.lrow .date { font-size: 14px; color: var(--ice-70); white-space: nowrap; }
.lrow.today { background: linear-gradient(90deg, rgba(95, 168, 211, .16), rgba(95, 168, 211, .03) 60%, transparent); box-shadow: inset 3px 0 var(--blue); }
.lrow.today .date { color: var(--ice); font-weight: 500; }
.lrow.future { opacity: .32; }
.cell { display: flex; justify-content: center; }
.tick {
  appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 0;
  border: 1px solid var(--blue); background: transparent; position: relative; flex: none;
  transition: background .15s, box-shadow .15s;
}
.tick:checked { background: var(--blue); }
.tick:checked::after {
  content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
  border: solid var(--ink); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.future .tick { border-style: dashed; }
.tick:not(:disabled) { cursor: pointer; box-shadow: 0 0 0 4px rgba(95, 168, 211, .14); }
.s { display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; min-width: 0; }
.val {
  width: 100%; min-width: 0; text-align: right; font: 400 24px/1 var(--display); letter-spacing: .02em;
  background: none; border: 0; border-bottom: 1px solid transparent; padding: 0; margin: 0;
  appearance: textfield; -moz-appearance: textfield; caret-color: var(--blue); pointer-events: none;
}
.val::-webkit-outer-spin-button, .val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.val:invalid { box-shadow: none; }
.s i { font: 500 10px/1 var(--mono); color: var(--blue); font-style: normal; }
.val:placeholder-shown + i { visibility: hidden; }
.editing .val:not([readonly]) + i { visibility: visible; }
.editing .val:not([readonly]) { pointer-events: auto; border-bottom-color: var(--blue); }
.editing .val:not([readonly]):focus { outline: none; border-bottom-color: var(--ice); }
.log.train .lrow { grid-template-columns: 124px repeat(var(--n), minmax(0, 1fr)); }
.log.train .lrow.lhead .h { text-align: right; }
.log.train { margin-top: 16px; }

.more { margin: 14px 0 0; }
.editing .more { display: none; }
.legend { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 32px; }
.legend li { font-size: 14px; color: var(--ice-70); max-width: 44ch; }
.legend b { display: block; font-weight: 500; font-size: 15px; color: var(--ice); margin-bottom: 2px; }
.legend b small { font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-left: 8px; }

/* ── cards ──────────────────────────────────────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--card); border-top: 2px solid var(--blue); padding: 24px 24px 26px; min-width: 0; }
.card .label { color: var(--blue); display: block; }
.card .name { margin: 14px 0 0; font: 400 clamp(26px, 2.6vw, 32px)/1 var(--display); letter-spacing: .02em; }
.card .name small {
  font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ice-45); margin-left: 10px;
}
.stat { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 0; }
.num { font: 400 clamp(72px, 8vw, 104px)/1 var(--display); letter-spacing: .01em; color: var(--ice); }
.sub { display: block; margin-top: 6px; color: var(--ice-45); }
.unit { color: var(--blue); font-size: 12px; text-transform: none; }
.card .note { margin: 14px 0 0; font-size: 14px; color: var(--ice-70); max-width: 34ch; }

/* ── footer ─────────────────────────────────────────────────────────── */
footer {
  max-width: var(--w); margin: 0 auto; padding: 0 var(--pad) calc(var(--pad) * 1.2);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--ice-45);
}
footer a { text-decoration: none; }
footer a:hover { color: var(--ice); }
.status { color: var(--ice-70); min-height: 1em; }
.status.bad { color: #ff9e9e; }

/* ── edit bar ───────────────────────────────────────────────────────── */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: rgba(5, 11, 22, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--blue);
  padding: 14px var(--pad) calc(14px + env(safe-area-inset-bottom));
}
.bar[hidden] { display: none; }
.row { max-width: var(--w); margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.row[hidden] { display: none; }
.row .status { flex: 1; }
#why { flex-basis: 100%; }
#why[hidden] { display: none; }
.row label { color: var(--ice-70); }
.pass {
  flex: 1; min-width: 0; background: rgba(23, 61, 89, .35); border: 1px solid var(--line);
  padding: 10px 12px; font-family: var(--mono); font-size: 14px; letter-spacing: .06em;
}
.pass:focus { outline: none; border-color: var(--blue); }
.btn {
  border: 1px solid var(--blue); background: none; padding: 10px 16px 9px; cursor: pointer;
  font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
  transition: background .15s, color .15s, opacity .15s;
}
.btn.solid { background: var(--blue); color: var(--ink); }
.btn:hover { background: var(--ice); color: var(--ink); border-color: var(--ice); }
.btn:disabled { opacity: .5; cursor: default; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

/* ── small screens ──────────────────────────────────────────────────── */
@media (max-width: 860px) {
  .cards { grid-template-columns: 1fr; }
  .legend { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .lrow { grid-template-columns: 72px repeat(var(--n), minmax(0, 1fr)) 44px; gap: 4px; padding: 9px 6px 9px 8px; }
  .lrow.lhead { align-items: end; }
  .lrow.lhead .h { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; font-size: 9px; letter-spacing: .08em; height: 58px; margin: 0 auto; }
  .lrow.lhead .s { align-self: end; }
  .lrow .date { font-size: 12px; }
  .tick { width: 18px; height: 18px; }
  .tick:checked::after { left: 5px; top: 1px; }
  .val { font-size: 20px; }
  .log.train .lrow { grid-template-columns: 72px repeat(var(--n), minmax(0, 1fr)); }
  .log.train .lrow.lhead .h { writing-mode: horizontal-tb; transform: none; height: auto; margin: 0; text-align: right; }
  .row { flex-wrap: wrap; }
  .row label { width: 100%; }
  .pass { flex-basis: 100%; }
  .row .status { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation: none !important; transition: none !important; }
}

</div>

   ranges are blurred and hazed, the near ones are crisp, under a moon and
   film grain. Fixed behind the whole page. Drawn once for the viewport's

    seed |= 0; seed = seed + 0x6D2B79F5 | 0;

function ridge(rnd, W, H, ctrl, amp, rough) {

  for (let i = 0; i < 8; i++) {
    const next = [pts[0]];
    for (let j = 1; j < pts.length; j++) {

    grad('rock' + i, [[0, L.rock[0], 0], ['.12', L.rock[0], .55], ['.28', L.rock[0], 1], [1, L.rock[1], 1]], defs);
    grad('snow' + i, [[0, L.snow], ['.3', L.snow], [1, L.rock[0]]], defs);
    const g = el('g', L.blur ? { filter: `url(#${L.blur})`, opacity: L.op } : { opacity: L.op || 1 });
    el('path', { d, fill: `url(#snow${i})` }, g);
    el('path', { d, fill: `url(#rock${i})`, transform: `translate(0 ${(L.cap * H).toFixed(1)})` }, g);
  });
  el('rect', { width: W, height: H, filter: 'url(#grain)', opacity: .07 });
  el('rect', { width: W, height: H, fill: 'url(#fade)' });
}
scene();
let aspect = innerWidth / innerHeight, timer;
addEventListener('resize', () => {
  clearTimeout(timer);
  timer = setTimeout(() => { const a = innerWidth / innerHeight; if (Math.abs(a - aspect) / aspect > .12) { aspect = a; scene(); } }, 200);
});
/* the page darkens the scene as it scrolls over it */
const veil = document.getElementById('veil'), bg = document.getElementById('bg');
const photo = () => document.body.classList.add('has-photo');
const tryPng = () => { if (!bg.src.endsWith('.png')) bg.src = '/bio/bg.png'; };
bg.addEventListener('load', photo); bg.addEventListener('error', tryPng);
if (bg.complete) bg.naturalWidth ? photo() : tryPng();
const dim = () => { veil.style.opacity = Math.min(1, scrollY / (innerHeight * .45)).toFixed(2); };
addEventListener('scroll', dim, { passive: true }); dim();

/* ── the log ────────────────────────────────────────────────────────── */
const API = 'https://fiery-eel-944.eu-west-1.convex.site/overlap';
const $ = id => document.getElementById(id);
const today = dateKey(), HABITS = SPEC.habits, TESTS = SPEC.exercises, SHOWN = 14;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const pretty = (key, dow) => { const [y, m, d] = key.split('-').map(Number); const t = new Date(y, m - 1, d); return (dow ? DOW[t.getDay()] + ' ' : '') + d + ' ' + MON[m - 1]; };
const state = { log: {}, updatedAt: 0 };

function api(op, args) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op, args: args || {} }), signal: ctl.signal })
    .then(r => r.json())
    .then(j => { clearTimeout(t); if (j && j.ok) return j.value; throw new Error((j && j.error) || 'Something went wrong'); },
          e => { clearTimeout(t); throw new Error(e.name === 'AbortError' ? 'The server timed out after 9 seconds' : 'The server is unreachable right now'); });
}

/* The rows: today first, back to the first logged day, or to yesterday
   when the log is new. Fourteen at most until "Earlier days" is pressed. */
let rows = [], all = false;
const first = () => Object.keys(state.log).filter(k => k <= today).sort()[0];
const numCell = (id, m, label) => `<span class="s"><input class="val" id="${id}" type="number" inputmode="decimal" min="0" max="${m.max}" step="${m.step}" placeholder=" " readonly aria-label="${label}"><i>${m.unit}</i></span>`;
function grid(host, cols, cell) {
  host.style.setProperty('--n', cols.length);
  host.innerHTML = `<div class="lrow lhead" role="row"><span class="date">Date</span>${cols.map(c => `<span class="h" title="${c.name}">${c.short || c.name}</span>`).join('')}${cell.tail ? `<span class="s">${cell.tail}</span>` : ''}</div>`;
  for (const r of rows) {
    const div = document.createElement('div');
    div.className = 'lrow ' + r.when; div.setAttribute('role', 'row');
    div.innerHTML = `<span class="date">${pretty(r.key, true)}</span>` + cols.map(c => cell.one(r.key, c)).join('') + (cell.tail ? cell.last(r.key) : '');
    host.appendChild(div);
  }
}
function build() {
  const f = first(), yesterday = shift(today, -1);
  let from = f && f < yesterday ? f : yesterday;
  const hidden = all ? 0 : Math.max(0, daysBetween(from, today) + 1 - SHOWN);
  if (hidden) from = shift(today, 1 - SHOWN);
  rows = [];
  for (let k = today; k >= from; k = shift(k, -1)) rows.push({ key: k, when: k === today ? 'today' : 'past' });
  grid($('log'), HABITS, {
    one: (key, h) => `<label class="cell"><input class="tick" type="checkbox" id="h-${key}-${h.id}" disabled aria-label="${h.name}, ${pretty(key)}"></label>`,
    tail: 'Sleep', last: key => numCell('s-' + key, SPEC.sleep, 'Sleep, ' + pretty(key)),
  });
  grid($('train'), TESTS, { one: (key, e) => numCell(`t-${key}-${e.id}`, e, `${e.name}, ${pretty(key)}`) });
  $('more').hidden = !hidden;
  $('more').textContent = `Earlier days · ${hidden} more`;
}
$('more').addEventListener('click', () => { all = true; build(); paint(); });
$('legend').innerHTML = HABITS.map(h => `<li><b>${h.name}<small>${h.short}</small></b>${h.why}</li>`).join('');

/* one card, one number: the best result so far, or the target */
TESTS.forEach((e, i) => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `
    <span class="label mono">0${i + 1} · ${e.discipline}</span>
    <p class="name">${e.name}<small>${e.protocol}</small></p>
    <div class="stat"><span class="num" id="n-${e.id}"></span><span class="unit mono">${e.unit}</span></div>
    <span class="sub mono" id="b-${e.id}"></span>
    <p class="note">${e.note}</p>`;
  $('cards').appendChild(c);
});

const val = (id, v) => { $(id).value = Number.isFinite(v) ? v : ''; };
function paint() {
  for (const r of rows) {
    const d = state.log[r.key];
    for (const h of HABITS) $(`h-${r.key}-${h.id}`).checked = !!d?.habits?.[h.id];
    val('s-' + r.key, d?.sleep);
    for (const e of TESTS) val(`t-${r.key}-${e.id}`, d?.train?.[e.id]);
  }
  /* the last seven days, today included */
  let checks = 0, hours = 0, nights = 0, trained = 0;
  for (let i = 0; i < 7; i++) {
    const d = state.log[shift(today, -i)]; if (!d) continue;
    for (const h of HABITS) if (d.habits?.[h.id]) checks++;
    if (Number.isFinite(d.sleep)) { hours += d.sleep; nights++; }
    if (d.train && Object.keys(d.train).length) trained++;
  }
  $('sum').textContent = `Last 7 days · ${checks} of ${7 * HABITS.length} checks` + (nights ? ` · ${(hours / nights).toFixed(1)} h sleep on average` : '');
  const counts = [];
  for (const e of TESTS) {
    const b = bestOf(e, state.log);
    $('n-' + e.id).textContent = b.value;
    $('b-' + e.id).textContent = b.sessions ? `Best of ${b.sessions} ${b.sessions === 1 ? 'session' : 'sessions'}` : 'Target';
    counts.push(`${e.short.toLowerCase()} ${b.sessions}`);
  }
  $('tsum').textContent = `Last 7 days · ${trained} ${trained === 1 ? 'day' : 'days'} trained · all sessions: ${counts.join(', ')}`;
  const when = state.updatedAt ? new Date(state.updatedAt) : null;
  $('updated').textContent = !when ? '' :
    dateKey(when) === today ? 'Updated today' :
    dateKey(new Date(when.getTime() + 864e5)) === today ? 'Updated yesterday' :
    'Updated ' + pretty(dateKey(when));
}
function apply(doc) {
  if (!doc) return;
  state.log = doc.log && typeof doc.log === 'object' ? doc.log : {};
  state.updatedAt = doc.updatedAt || 0;
}
build(); paint();
api('bio.get').then(doc => { apply(doc); if (!document.body.classList.contains('editing')) build(); paint(); }).catch(() => {});

/* ── editing ────────────────────────────────────────────────────────── */
const bar = $('bar'), gate = $('gate'), tools = $('tools'), pass = $('pass'), status = $('status');
const PASS = 'bio.pass';
const remembered = () => { try { return sessionStorage.getItem(PASS) || ''; } catch (e) { return ''; } };
const remember = p => { try { p ? sessionStorage.setItem(PASS, p) : sessionStorage.removeItem(PASS); } catch (e) {} };
const say = (t, bad) => { status.textContent = t; status.classList.toggle('bad', !!bad); };

function open(editing) {
  document.body.classList.toggle('editing', editing);
  for (const r of rows) {
    for (const h of HABITS) $(`h-${r.key}-${h.id}`).disabled = !editing;
    $('s-' + r.key).readOnly = !editing;
    for (const e of TESTS) $(`t-${r.key}-${e.id}`).readOnly = !editing;
  }
  bar.hidden = !editing; gate.hidden = editing; tools.hidden = !editing;
  if (editing) { say('Editing. Every day shown is open, in both logs.'); document.querySelector('.lrow.today .tick')?.focus(); }
}
$('edit').addEventListener('click', () => {
  if (remembered()) return open(true);
  bar.hidden = false; gate.hidden = false; tools.hidden = true; $('why').hidden = true; pass.value = ''; pass.focus();
});
gate.addEventListener('submit', async ev => {
  ev.preventDefault();
  const p = pass.value; $('unlock').disabled = true; $('why').hidden = true;
  try { await api('bio.unlock', { passphrase: p }); remember(p); open(true); }
  catch (e) {
    pass.classList.remove('shake'); void pass.offsetWidth; pass.classList.add('shake'); pass.select();
    $('why').textContent = /Unknown operation/.test(e.message) ? 'The server runs an older version. Pull the repository, then deploy the overlap folder.' : e.message;
    $('why').hidden = false;
  }
  $('unlock').disabled = false;
});
function cancel() { paint(); open(false); }
document.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', cancel));

async function save() {
  const log = { ...state.log };
  for (const r of rows) {
    const entry = { habits: Object.fromEntries(HABITS.map(h => [h.id, $(`h-${r.key}-${h.id}`).checked])), train: {} };
    const s = $('s-' + r.key).value;
    if (s !== '') entry.sleep = Number(s);
    for (const e of TESTS) { const v = $(`t-${r.key}-${e.id}`).value; if (v !== '') entry.train[e.id] = Number(v); }
    log[r.key] = entry;
  }
  const draft = clean({ log }, today);
  $('save').disabled = true; say('Saving…');
  try {
    const doc = await api('bio.save', { passphrase: remembered(), today, ...draft });
    apply(doc); open(false); build(); paint();
  } catch (e) {
    say(e.message, true);
    if (/passphrase/i.test(e.message)) { remember(''); gate.hidden = false; tools.hidden = true; pass.value = ''; pass.focus(); }
  }
  $('save').disabled = false;
}
$('save').addEventListener('click', save);
addEventListener('keydown', ev => {
  if (!document.body.classList.contains('editing')) return;
  if (ev.key === 'Escape') cancel();
  if (ev.key === 'Enter' && ev.target.classList.contains('val')) { ev.preventDefault(); save(); }
});
</script>
</body>
</html>
