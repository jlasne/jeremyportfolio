<style>
  @font-face { font-family: "Unbounded"; src: url(fonts/unbounded.woff2) format("woff2"); font-weight: 200 900; font-display: block; }
  @font-face { font-family: "Inter Tight"; src: url(fonts/inter-tight.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Space Grotesk"; src: url(fonts/space-grotesk.woff2) format("woff2"); font-weight: 300 700; font-display: block; }
  @font-face { font-family: "Instrument Serif"; src: url(fonts/instrument-serif.woff2) format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: "Instrument Serif"; src: url(fonts/instrument-serif-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url(fonts/jetbrains-mono.woff2) format("woff2"); font-weight: 100 800; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #050b16;
    --blue: #5fa8d3;
    --ice: #eaf4fb;
    --ice-70: rgba(234, 244, 251, .72);
    --ice-45: rgba(234, 244, 251, .46);
    --ice-20: rgba(234, 244, 251, .2);
    --line: rgba(95, 168, 211, .18);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  html { background: var(--ink); color-scheme: dark; }
  body {
    min-height: 100dvh; display: flex; flex-direction: column;
    font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ice); background: var(--ink); -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--blue); color: var(--ink); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible, .scrub:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ice-45);
  }
  header a { color: inherit; text-decoration: none; }
  header a:hover { color: var(--blue); }
  header b { color: var(--ice); font-weight: 600; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  }
  .player { width: min(100%, calc((100dvh - 200px) * 16 / 9)); min-width: min(100%, 320px); }

  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px;
    background: var(--ink);
    box-shadow: 0 0 0 1px rgba(234, 244, 251, .08), 0 30px 90px -30px rgba(95, 168, 211, .35);
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the chip that turns the sound on; it breathes on the beat */
  .chip {
    position: absolute; left: 14px; bottom: 14px; z-index: 3;
    display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 11px; border-radius: 999px;
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink); background: rgba(234, 244, 251, .94);
    box-shadow: 0 8px 30px -8px rgba(5, 11, 22, .7);
    transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .chip svg { width: 16px; height: 16px; }
  .chip .eq { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .chip .eq i { width: 2px; background: var(--ink); border-radius: 1px; height: 30%; transition: height .08s linear; }
  .chip[hidden] { display: flex; opacity: 0; transform: translateY(8px); pointer-events: none; }
  @media (hover: hover) { .chip:hover { background: var(--blue); } }

  .big {
    position: absolute; inset: 0; z-index: 2; display: none; place-items: center;
    background: rgba(5, 11, 22, .35);
  }
  .big span {
    width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(234, 244, 251, .94); color: var(--ink); box-shadow: 0 10px 40px -10px rgba(5, 11, 22, .8);
    transition: transform .25s var(--ease);
  }
  .big svg { width: 30px; height: 30px; margin-left: 4px; }
  .big.on { display: grid; }
  @media (hover: hover) { .big:hover span { transform: scale(1.06); } }

  /* guides: title safe, action safe, thirds, and the frame counter */
  .guides { position: absolute; inset: 0; z-index: 1; pointer-events: none; display: none; }
  .guides.on { display: block; }
  .guides svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .guides .hud {
    position: absolute; left: 3.5%; top: 3.5%; font-family: var(--mono); font-size: clamp(9px, 1.1vw, 12px);
    line-height: 1.5; color: var(--blue); text-shadow: 0 0 4px var(--ink); white-space: pre;
  }

  /* the transport */
  .bar { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-family: var(--mono); font-size: 12px; }
  .btn {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 8px; color: var(--ice-70);
    transition: color .2s, background .2s;
  }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn .fill { fill: currentColor; stroke: none; }
  .btn[aria-pressed="true"] { color: var(--blue); }
  @media (hover: hover) { .btn:hover { color: var(--ice); background: rgba(234, 244, 251, .06); } }
  .btn .alt { display: none; }
  .btn[data-state="on"] .main { display: none; }
  .btn[data-state="on"] .alt { display: block; }
  .tc { flex: none; min-width: 11.5ch; color: var(--ice-70); font-variant-numeric: tabular-nums; padding: 0 6px; }
  .tc b { color: var(--ice); font-weight: 600; }

  .scrub { position: relative; flex: 1; height: 36px; cursor: pointer; touch-action: none; border-radius: 6px; }
  .scrub .track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--ice-20); overflow: hidden; }
  .scrub .fillbar { position: absolute; inset: 0; transform-origin: 0 50%; background: var(--blue); transform: scaleX(0); }
  .scrub .tick { position: absolute; top: 50%; width: 1px; height: 12px; margin-top: -6px; background: var(--ice-20); }
  .scrub .tick.beat { height: 6px; margin-top: -3px; background: rgba(234, 244, 251, .1); }
  .scrub .seg { position: absolute; top: 3px; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--ice-45); white-space: nowrap; overflow: hidden; text-overflow: clip; padding-left: 3px; pointer-events: none; }
  .scrub .head { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 0 3px rgba(95, 168, 211, .35); left: 0; }

  footer {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
    padding: 4px max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    font-family: var(--mono); font-size: 11px; line-height: 1.6; letter-spacing: .03em; color: var(--ice-45);
  }
  footer a { color: var(--ice-70); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--blue); }
  kbd { font: inherit; color: var(--ice-70); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .keys span { margin-right: 12px; white-space: nowrap; }

  @media (max-width: 640px) {
    .scrub .seg, .scrub .tick.beat { display: none; }
    .keys { display: none; }
    .tc { min-width: 0; font-size: 11px; }
    .btn { width: 32px; }
    .hide-sm { display: none; }
    main { padding-top: 12px; }
    .chip { left: 8px; bottom: 8px; padding: 5px 10px 5px 8px; font-size: 10px; gap: 6px; }
    .chip svg { width: 13px; height: 13px; }
    .chip .eq { height: 9px; }
  }

  /* export: exactly 1920x1080, nothing else */
  body.export { display: block; overflow: hidden; }
  body.export header, body.export footer, body.export .bar, body.export .chip, body.export .big { display: none !important; }
  body.export main { padding: 0; display: block; }
  body.export .player { width: 1920px; }
  body.export .stage { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>

<header>

<main>

      <canvas id="out" role="img" aria-label="A 15 second motion design reel, drawn live in code."></canvas>
      <div class="guides" id="guides" aria-hidden="true">

      </button>
      <button class="btn" id="fs" type="button" aria-label="Full screen">

</main>

<footer>
  <span>15 s · 900 frames · 128 BPM. Drawn live in your browser: 1 canvas, 1 shader, 1 synth, 0 video files. <a id="dl" href="showreel.mp4" download>Download MP4</a></span>
  <span class="keys"><span><kbd>Space</kbd> play</span><span><kbd>←</kbd><kbd>→</kbd> frame</span><span><kbd>⇧</kbd>+<kbd>←</kbd><kbd>→</kbd> beat</span><span><kbd>G</kbd> guides</span><span><kbd>M</kbd> sound</span></span>
</footer>

<script src="engine.js"></script>
<script src="audio.js"></script>
<script>
// the reel, in play order; each file registers its scenes with Reel.scene()
const FILES = ['score.js', 'scenes/s1.js', 'scenes/s2.js', 'scenes/s3.js', 'scenes/s4.js', 'scenes/s5.js', 'scenes/s6.js', 'scenes/s7.js'];
</script>
<script>
(() => {
  'use strict';
  const R = Reel, A = ReelAudio, q = new URLSearchParams(location.search);
  const EXPORT = q.has('export');
  const only = q.get('only');           // ?only=s3 loads just that scene (and the score)
  const $ = id => document.getElementById(id);
  const stage = $('stage'), out = $('out');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (EXPORT) document.body.classList.add('export');

  const load = src => new Promise(res => {
    const s = document.createElement('script');
    s.src = src; s.async = false; s.onload = res;
    s.onerror = () => { console.warn('missing', src); res(); };
    document.head.appendChild(s);
  });

  const fonts = [['Unbounded', 900], ['Unbounded', 400], ['Inter Tight', 800], ['Inter Tight', 400], ['Space Grotesk', 700],
    ['Instrument Serif', 400], ['JetBrains Mono', 500]];

  // ---- sizes: render at the displayed resolution, capped ----
  const CAP = q.has('hq') ? 2560 : 1920;
  let scale = 1;
  function resize() {
    const r = stage.getBoundingClientRect(), dpr = EXPORT ? 1 : Math.min(devicePixelRatio || 1, 2);
    const w = EXPORT ? 1920 : Math.max(320, Math.round(r.width * dpr));
    out.width = Math.min(w, CAP); out.height = Math.round(out.width * 9 / 16);
    R.setRenderSize(Math.min(w, CAP) * scale);
    dirty = true;
  }

  // ---- clock ----
  let t = 0, playing = !reduced && !EXPORT, loop = true, sound = false, dirty = true, last = performance.now();
  const FR = 1 / R.FPS, D = R.DUR;
  const snap = x => Math.round(x * R.FPS) / R.FPS;
  if (q.has('t')) { t = Math.max(0, Math.min(D - FR, +q.get('t') || 0)); playing = false; }
  if (reduced && !q.has('t')) t = R.poster || 13.2;

  function setPlaying(v) {
    playing = v;
    $('play').dataset.state = v ? 'on' : 'off';
    $('play').setAttribute('aria-label', v ? 'Pause' : 'Play');
    $('big').classList.toggle('on', !v && reduced && t === (R.poster || 13.2) && !sound);
    if (sound) { if (v) A.start(t, loop); else A.stop(); }
    last = performance.now();
  }
  function seek(x) {
    t = Math.max(0, Math.min(D - FR, x));
    if (sound && playing) A.start(t, loop);
    dirty = true;
  }

  async function soundOn(fromStart) {
    const c = A.context();
    if (c.state !== 'running') await c.resume();
    await audioReady;
    sound = true;
    $('snd').setAttribute('aria-pressed', 'true');
    $('snd').querySelector('.alt-on').style.display = '';
    $('snd').querySelector('.alt-off').style.display = 'none';
    $('chip').hidden = true;
    if (fromStart) t = 0;
    setPlaying(true);
  }
  function soundOff() {
    sound = false; A.stop();
    $('snd').setAttribute('aria-pressed', 'false');
    $('snd').querySelector('.alt-on').style.display = 'none';
    $('snd').querySelector('.alt-off').style.display = '';
  }

  // ---- adaptive quality: drop resolution if frames are slow ----
  let slow = 0, fast = 0;
  function adapt(ms) {
    if (EXPORT) return;
    if (ms > 22) { slow++; fast = 0; } else if (ms < 9) { fast++; slow = 0; } else { slow = Math.max(0, slow - 1); }
    if (slow > 40 && scale > .5) { scale = Math.max(.5, scale - .25); R.quality = scale < 1 ? 0 : 1; slow = 0; resize(); }
    if (fast > 240 && scale < 1) { scale = Math.min(1, scale + .25); R.quality = scale < 1 ? 0 : 1; fast = 0; resize(); }
  }

  // ---- UI ----
  const scrub = $('scrub'), fillbar = $('fillbar'), head = $('head'), tc = $('tc'), hud = $('hud');
  const pad2 = n => String(n).padStart(2, '0');
  const code = x => { const f = Math.round(x * R.FPS); return pad2(Math.floor(f / R.FPS)) + ':' + pad2(f % R.FPS); };
  const secs = x => (Math.round(x * R.FPS) / R.FPS).toFixed(2).padStart(5, '0');
  function buildScrub() {
    for (let b = 0; b <= 32; b++) {
      const el = document.createElement('i');
      el.className = 'tick' + (b % 4 ? ' beat' : '');
      el.style.left = (b * R.BEAT / D * 100) + '%';
      scrub.appendChild(el);
    }
    const seen = new Set();
    for (const s of R.scenes) {
      if (!s.name || seen.has(s.name)) continue;
      seen.add(s.name);
      const el = document.createElement('span');
      el.className = 'seg';
      el.textContent = s.name;
      el.style.left = (s.start / D * 100) + '%';
      el.style.width = ((s.end - s.start) / D * 100) + '%';
      scrub.appendChild(el);
    }
  }
  let lastUI = -1;
  function ui() {
    const f = Math.round(t * R.FPS);
    if (f === lastUI) return;
    lastUI = f;
    const p = t / (D - FR);
    fillbar.style.transform = `scaleX(${p})`;
    head.style.left = (p * 100) + '%';
    tc.innerHTML = `<b>${secs(t)}</b> / ${secs(D)} s`;
    scrub.setAttribute('aria-valuenow', t.toFixed(2));
    if ($('guides').classList.contains('on')) {
      const beat = Math.floor(t / R.BEAT), sc = R.scenes.filter(s => t >= s.start && t < s.end).map(s => s.id).join(' + ');
      hud.textContent = `${code(t)}  F ${String(f).padStart(3, '0')}\nBAR ${Math.floor(beat / 4) + 1}.${beat % 4 + 1}  ${R.BPM} BPM\n${sc}`;
    }
    // the chip's meter breathes on the beat
    const bars = $('chip').querySelectorAll('.eq i'), ph = (t / R.BEAT) % 1;
    bars.forEach((b, i) => { const k = Math.exp(-((ph + i * .13) % 1) * 5); b.style.height = (25 + 75 * k) + '%'; });
  }

  let dragging = false, wasPlaying = false;
  const fromEvent = e => { const r = scrub.getBoundingClientRect(); return snap(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * D); };
  scrub.addEventListener('pointerdown', e => {
    dragging = true; wasPlaying = playing; scrub.setPointerCapture(e.pointerId);
    if (playing) setPlaying(false);
    seek(fromEvent(e));
  });
  scrub.addEventListener('pointermove', e => { if (dragging) seek(fromEvent(e)); });
  const endDrag = () => { if (!dragging) return; dragging = false; if (wasPlaying) setPlaying(true); };
  scrub.addEventListener('pointerup', endDrag);
  scrub.addEventListener('pointercancel', endDrag);

  $('play').onclick = () => { if (!playing && t >= D - FR * 1.5) t = 0; setPlaying(!playing); };
  $('big').onclick = () => { t = 0; soundOn(true); $('big').classList.remove('on'); };
  $('chip').onclick = () => soundOn(true);
  $('snd').onclick = () => sound ? soundOff() : soundOn(false);
  $('loop').onclick = () => { loop = !loop; $('loop').setAttribute('aria-pressed', loop); A.setLoop(loop); };
  $('grid').onclick = () => { const on = $('guides').classList.toggle('on'); $('grid').setAttribute('aria-pressed', on); lastUI = -1; };
  $('fs').onclick = () => {
    const el = stage;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  };
  document.addEventListener('fullscreenchange', resize);
  stage.addEventListener('dblclick', () => $('fs').click());

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); $('play').click(); }
    else if (k === 'ArrowRight' || k === 'ArrowLeft') {
      e.preventDefault();
      if (playing) setPlaying(false);
      const dir = k === 'ArrowRight' ? 1 : -1;
      if (e.shiftKey) { const b = Math.round(t / R.BEAT); seek(snap((b + dir) * R.BEAT)); }
      else seek(snap(t + dir * FR));
    }
    else if (k === 'Home') { e.preventDefault(); seek(0); }
    else if (k === 'End') { e.preventDefault(); seek(D - FR); }
    else if (k === 'm' || k === 'M') $('snd').click();
    else if (k === 'g' || k === 'G') $('grid').click();
    else if (k === 'f' || k === 'F') $('fs').click();
    else if (k === 'l' || k === 'L') $('loop').click();
    else if (/^[0-9]$/.test(k)) seek(snap(+k / 10 * D));
  });

  // ---- the loop ----
  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(.1, (now - last) / 1000);
    last = now;
    if (playing && !dragging) {
      const at = sound ? A.time() : null;
      if (at !== null && at !== undefined) t = at;
      else t += dt;
      if (t >= D) {
        if (loop) t %= D;
        else { t = D - FR; setPlaying(false); }
      }
      dirty = true;
    }
    if (!dirty) return;
    dirty = false;
    const t0 = performance.now();
    R.renderAt(t);
    adapt(performance.now() - t0);
    ui();
  }

  let audioReady;
  window.__reel = {
    ready: (async () => {
      await Promise.all(fonts.map(([f, w]) => document.fonts.load(`${w} 64px "${f}"`)));
      for (const f of FILES) {
        if (only && f.startsWith('scenes/') && !only.split(',').some(o => f.includes(o + '.js'))) continue;
        await load(f);
      }
      R.initOutput(out, { preserve: EXPORT });
      resize();
      R.setup();
      audioReady = A.render().catch(e => console.warn('audio', e));
      if (EXPORT) return true;
      buildScrub();
      addEventListener('resize', resize);
      new ResizeObserver(resize).observe(stage);
      setPlaying(playing);
      $('chip').hidden = reduced;
      if (reduced) $('big').classList.add('on');
      requestAnimationFrame(tick);
      return true;
    })(),
    // export hooks: render one exact frame; get the soundtrack as base64 WAV
    seek(x) { t = x; R.renderAt(x); return true; },
    async wav() {
      await audioReady;
      const b = new Uint8Array(A.wav());
      let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
      return btoa(s);
    },
    get t() { return t; },
  };
})();
</script>
</body>
</html>
